<!doctype html>
<!-- El lang NO se cablea: lo pone Root.razor desde el idioma que resolvio C#, que es el mismo
     que usa el catalogo de textos. Estaba en "en" con tres de las cinco pantallas en espanol. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mymi</title>
<style>
  :root {
    /* LA MISMA PALETA DE LA PANTALLA DEL TELEFONO. No una parecida: es el mismo producto,
       y dos violetas casi iguales se leen como un error de imprenta. */
    --ink:#241F3D; --soft:#6F6B85; --line:#E7E4F2; --bg:#fff; --panel:#F8F6FD;
    --brand:#6C4BD9; --brand-dark:#4A2FB0; --warn:#8a6d1f; --warn-bg:#fdf8e7;
    --danger:#b4232a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:#EDEAF6; --soft:#A29DBA; --line:#312B47; --bg:#171422; --panel:#211C33;
      --brand:#A98CFF; --brand-dark:#C0AAFF; --warn:#d9bc6a; --warn-bg:#262015;
      --danger:#ef8f95;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{border-bottom:1px solid var(--line);padding:14px 22px;display:flex;
    align-items:center;gap:12px;flex-wrap:wrap}
  /* LA MASCOTA, SIN CAJA. En la ventana el papel ya es blanco, asi que el mosaico lila
     sobraba: se leia como un icono pegado y no como la cara del producto. Suelta necesita
     mas tamano para tener la misma presencia. */
  header .cara{width:56px;height:56px;display:block}
  header .brand{font-weight:700;font-size:22px;letter-spacing:-.4px}
  main{padding:22px;max-width:900px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
  h2{font-size:17px;margin:0 0 10px}
  p.sub{color:var(--soft);margin:0 0 20px}
  /* LA FRANJA ES DE LA INSTITUCION. `--marca` la pone cada tarjeta con el color que la
     institucion declaro; cuando no declaro ninguno cae al de Mymi y la tarjeta se ve como
     antes. Es lo unico que la institucion decide de esta pantalla: el resto es de Mymi. */
  .card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;
    background:var(--panel);margin-bottom:12px;
    border-left:4px solid var(--marca,var(--brand))}
  .quien{display:flex;align-items:center;gap:14px;min-width:0}
  .marca{width:42px;height:42px;flex:none;border-radius:11px;object-fit:cover;
    background:#fff;box-shadow:0 1px 3px rgba(26,32,40,.14)}
  .marca.sinlogo{display:grid;place-items:center;font-size:24px;background:var(--panel)}
  .lema{color:var(--soft);font-size:13px;margin-top:1px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .title{font-weight:600}
  .meta{color:var(--soft);font-size:13px}
  .off{opacity:.55}
  button{font:inherit;font-weight:600;font-size:14px;border-radius:999px;cursor:pointer;
    padding:9px 18px;border:1px solid transparent;background:var(--brand);color:#fff;
    box-shadow:0 4px 12px rgba(108,75,217,.22)}
  button:hover{background:var(--brand-dark)}
  button.ghost{background:transparent;color:var(--brand);border-color:var(--brand);box-shadow:none}
  button.small{padding:5px 11px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  input[type=text]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);
    border-radius:6px;background:var(--bg);color:var(--ink);min-width:190px}
  label.field{display:block;font-size:13px;color:var(--soft);margin:8px 0 2px}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--soft);font-weight:600;font-size:12px;text-transform:uppercase;
    letter-spacing:.04em}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:11px 13px;font:12px/1.5 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;overflow-x:auto;margin:10px 0 0}
  .notice{border:1px solid var(--line);border-left:3px solid var(--warn);
    background:var(--warn-bg);border-radius:7px;padding:11px 14px;font-size:13px;
    margin-bottom:12px}
  .denied{border-left-color:var(--danger)}
  .empty{color:var(--soft);text-align:center;padding:36px 20px}
  .crumb{color:var(--soft);font-size:13px;margin:0 0 14px}
  .crumb button{background:none;border:none;color:var(--brand);padding:0;font-weight:600}
  .query{border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:12px}
  .query .desc{color:var(--soft);font-size:13px;margin:2px 0 8px}

  /* --- the module's own screen, inside the window (Cara.razor) --- */
  .carabar{display:flex;gap:14px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);
    background:var(--panel)}
  .carabar .meta{margin-left:auto}
  iframe.cara{display:block;width:100%;height:calc(100vh - 44px);border:0;background:#fff}

  /* --- tabs: Modulos / Asistente / Ajustes --- */
  nav.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
  nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--soft);
    border-radius:0;padding:11px 14px;font-weight:600;box-shadow:none}
  nav.tabs button:hover{background:none;color:var(--ink)}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}

  /* --- inline link button (e.g. "ponela en Ajustes") --- */
  button.link{background:none;border:none;color:var(--brand);padding:0;font-weight:600;
    font-size:inherit}
  button.link:hover{background:none;text-decoration:underline}

  /* --- settings inputs --- */
  select,input[type=password]{font:inherit;font-size:14px;padding:6px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);
    min-width:260px;max-width:100%}

  /* --- assistant chat --- */
  .chat{display:flex;flex-direction:column;gap:8px;margin:8px 0 16px;min-height:120px}
  .bubble{max-width:78%;padding:9px 13px;border-radius:12px;font-size:14px;white-space:pre-wrap;
    word-wrap:break-word}
  .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .bubble.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .bubble.bot.pending{color:var(--soft);font-style:italic}
  .bubble.bot.fail{border-left:3px solid var(--danger);color:var(--danger)}
  .trace-label{align-self:flex-start;color:var(--soft);font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;margin-top:4px}
  .trace{align-self:flex-start;max-width:82%;color:var(--soft);font-size:12px;
    font-family:ui-monospace,Consolas,monospace;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;white-space:pre-wrap;word-wrap:break-word}
  .ask{display:flex;gap:8px;align-items:center}
  .ask input[type=text]{flex:1}
</style>
</head>
<body>
  <div id="app"></div>
  <script src="_framework/blazor.webview.js"></script>
  <script src="frames.js"></script>
</body>
</html>
