worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;

        # EL PAQUETE DEL MODULO SALE CON SU PROPIO TIPO, no como application/octet-stream:
        # en Android el selector y el share entregan content:// y ahi manda el mime, no la
        # extension; el intent filter de Gnothi (MainActivity.cs) se ofrece por este tipo.
        application/vnd.gnothi.module gmod;
    }

    sendfile on;

    gzip_static on;

    server {
        listen 8120;
        listen 8483 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        location = / {
            root /usr/share/nginx/descarga;
            try_files /index.html =404;
        }

        # LOS DESCARGABLES DEL PASO A PASO CON GNOTHI, y ninguno va al repo: se arman antes de
        # levantar URL1 (ver el README o el comentario de la seccion #gnothi en index.html).
        #   descargas/gnothi/Gnothi.Host.zip   Gnothi para Windows
        #   descargas/municipalidad.gmod   la forma cargo (escritorio)
        #   descargas/movil/<modulo>.gmod      la forma hospedada (telefono); lleva el ORIGEN adentro
        #                                      y tiene que ser el que sirve esta pagina
        location /descargas/ {
            root /usr/share/nginx/descarga;
        }

        location = /app { return 301 /app/; }

        location /app/eventos/ {
            proxy_pass http://eventos-api:8121/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /app/service-worker.js {
            alias /usr/share/nginx/app/service-worker.js;
            add_header Service-Worker-Allowed /app/;
            add_header Cache-Control "no-cache";
        }

        location = /app/service-worker-assets.js {
            alias /usr/share/nginx/app/service-worker-assets.js;
            add_header Cache-Control "no-cache";
        }

        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/ /app/index.html;
        }
    }
}
