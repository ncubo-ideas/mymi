<title>Mymi en el teléfono</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  --pagina:#ece9f4; --pagina-tinta:#241F3D; --pagina-tenue:#6F6B85; --pagina-borde:#ddd8ec;
  --pagina-panel:#fff; --pagina-hundido:#e4dff2;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;

  /* LA PALETA DEL TELÉFONO, tal cual sale de Gnothi.Mobile/Assets/ui.html. NO es la del
     escritorio: el papel es más claro (#F5F3FB contra #F8F6FD) y hay dos tonos que el escritorio
     no tiene -- `--off` y `--off-soft` --, que son los de una consulta apagada. */
  --paper:#F5F3FB; --card:#FFFFFF; --ink:#241F3D; --muted:#6F6B85; --line:#E7E4F2;
  --accent:#6C4BD9; --accent-soft:#EEE9FC; --accent-ink:#4A2FB0;
  --off:#C0442E; --off-soft:#F9E7E2;
  --sombra:0 1px 2px rgba(36,31,61,.04), 0 6px 20px rgba(36,31,61,.07);
  --guia:#c2410c;
}
[hidden] { display:none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pagina:#120f1c; --pagina-tinta:#EDEAF6; --pagina-tenue:#A29DBA; --pagina-borde:#2b2540;
    --pagina-panel:#1b1729; --pagina-hundido:#171327;
  }
}
:root[data-theme="dark"] {
  --pagina:#120f1c; --pagina-tinta:#EDEAF6; --pagina-tenue:#A29DBA; --pagina-borde:#2b2540;
  --pagina-panel:#1b1729; --pagina-hundido:#171327;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--pagina); color:var(--pagina-tinta);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.marco { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:18px 30px; }

.titulo-fila { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:14px; }
h1.pag { font-size:18px; font-weight:700; letter-spacing:-.2px; margin:0; }
.titulo-fila .sub { font-size:13px; color:var(--pagina-tenue); }
.titulo-fila .sello { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--pagina-tenue); white-space:nowrap; }
/* EL SELECTOR ES DE LA LÁMINA, no del producto: el Host de verdad NEGOCIA con la persona y no
   tiene un botón de idioma. */
.idioma { font:inherit; font-size:12px; font-weight:600; padding:4px 12px; border-radius:999px;
  border:1px solid var(--pagina-borde); background:var(--pagina-panel); color:var(--pagina-tenue);
  cursor:pointer; }
.idioma:hover { color:var(--pagina-tinta); border-color:var(--pagina-tenue); }

/* ============================================================ la escena
   EL TELÉFONO AL MEDIO Y EL GUÍA A SU DERECHA, en dos columnas que no se pisan. Es la misma
   decisión que en el tour de escritorio: calcular un lado libre alrededor de cada objetivo no
   funciona, y una columna fija siempre está en el mismo lugar. */
.escena { display:grid; grid-template-columns:1fr 300px; gap:26px; align-items:start;
  justify-items:center; }
@media (max-width:820px) { .escena { grid-template-columns:1fr; } }

/* ------------------------------------------------ el aparato */
.aparato { position:relative; width:390px; height:844px; flex:none;
  border-radius:44px; padding:10px; background:#141019;
  box-shadow:0 0 0 2px #2a2336, 0 2px 6px rgba(20,12,40,.3), 0 40px 80px -30px rgba(20,12,40,.7); }
/* A pantalla chica el teléfono se achica en bloque, sin rehacer la UI: lo que se está mostrando
   ES un teléfono, y reflowear su contenido lo convertiría en otra cosa. */
@media (max-width:460px) { .aparato { transform:scale(.82); transform-origin:top center;
  margin-bottom:-152px; } }

.pantalla { position:relative; width:100%; height:100%; border-radius:35px; overflow:hidden;
  background:var(--paper); color:var(--ink); display:flex; flex-direction:column;
  font-size:15px; }

/* La isla del frente. No es decoración: sin ella el rectángulo no se lee como un teléfono. */
.isla { position:absolute; top:9px; left:50%; transform:translateX(-50%); width:104px; height:26px;
  border-radius:14px; background:#141019; z-index:40; }

.estado { flex:none; height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; font-size:12.5px; font-weight:600; color:var(--ink); letter-spacing:.2px; }
.estado .senal { display:flex; gap:4px; align-items:center; }
.estado svg { width:15px; height:15px; }

/* ------------------------------------------------ las vistas */
.vista { flex:1; min-height:0; overflow:auto; display:none; flex-direction:column; }
.vista.on { display:flex; }
.hoja-scroll { flex:1; min-height:0; overflow:auto; padding:0 16px 18px; }

.top { display:flex; align-items:center; gap:10px; padding:6px 16px 14px; flex:none; }
.top .logo { width:34px; height:34px; border-radius:10px; overflow:hidden; flex:none; }
.top .logo img { width:100%; height:100%; display:block; }
.top .tt { font-size:19px; font-weight:800; letter-spacing:-.3px; }
.top .ava { margin-left:auto; width:31px; height:31px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:13px; }

.hola { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:2px 0 12px; }
.hola .t b { display:block; font-size:21px; letter-spacing:-.3px; }
.hola .t small { color:var(--muted); font-size:12.5px; }
.addbtn { display:flex; align-items:center; gap:5px; border:0; border-radius:999px;
  background:var(--accent); color:#fff; font:inherit; font-size:13px; font-weight:700;
  padding:8px 14px; cursor:default; box-shadow:0 4px 12px rgba(108,75,217,.24); }
.addbtn[data-vivo="1"] { cursor:pointer; }
.addbtn span:first-child { font-size:16px; line-height:1; }

/* ------------------------------------------------ la tarjeta de una institución
   ES LA DE ui.html, campo por campo: el nombre en DOS NIVELES -- lo que la institución tiene
   antes, chico, sobre `brand.shortName`, grande --, el lema debajo, y abajo dos acciones: el
   candado con la cuenta de permisos, y «Abrir». En el escritorio el nombre va en un solo nivel;
   acá no, y esa diferencia es de `tiers()` en ui.html. */
.grid { display:grid; gap:12px; }
.mod { position:relative; border-radius:18px; padding:14px 15px 12px; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--sombra); overflow:hidden;
  --brand:var(--accent); --brand-soft:var(--accent-soft); }
.mod::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--brand); }
.mod .head { display:flex; align-items:center; gap:11px; }
.mod .ic { width:44px; height:44px; border-radius:13px; flex:none; object-fit:contain;
  background:var(--brand-soft); padding:5px; }
.mod .nm { min-width:0; }
.mod .nm .pre { display:block; font-size:11.5px; color:var(--muted); line-height:1.15; }
.mod .nm b { display:block; font-size:21px; letter-spacing:-.4px; line-height:1.15;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mod > small { display:block; color:var(--muted); font-size:12.5px; margin:8px 0 0; }
.mod .acts { display:flex; align-items:center; gap:8px; margin-top:12px; }
.mod .perm { display:flex; align-items:center; gap:5px; border:1px solid var(--line);
  background:var(--paper); color:var(--muted); border-radius:999px; padding:6px 11px;
  font:inherit; font-size:11.5px; font-weight:600; cursor:default; }
.mod .perm[data-vivo="1"] { cursor:pointer; }
.mod .perm svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; }
.mod .abrir { margin-left:auto; border:0; border-radius:999px; background:var(--brand); color:#fff;
  font:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; cursor:default; }
.mod .abrir[data-vivo="1"] { cursor:pointer; }

/* ------------------------------------------------ el detalle */
.volver { display:flex; align-items:center; gap:6px; background:none; border:0; padding:6px 0;
  color:var(--accent); font:inherit; font-size:13.5px; font-weight:700; cursor:default; }
.volver[data-vivo="1"] { cursor:pointer; }
.det-marca { display:flex; align-items:center; gap:12px; margin:6px 0 4px; }
.det-marca img { width:48px; height:48px; border-radius:14px; object-fit:contain;
  background:var(--brand-soft,var(--accent-soft)); padding:6px; }
.det-marca .pre { display:block; font-size:12px; color:var(--muted); }
.det-marca b { display:block; font-size:23px; letter-spacing:-.4px; }
.det-lema { color:var(--muted); font-size:13px; margin:0 0 16px; }

.bloque { background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 15px; margin-bottom:12px; box-shadow:var(--sombra); }
.bloque .cap { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
  font-weight:700; margin:0 0 4px; }
.master { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  background:none; border:0; padding:0; font:inherit; text-align:left; color:inherit; cursor:default; }
.master[data-vivo="1"] { cursor:pointer; }
.master b { display:block; font-size:15px; }
.master small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.master .flecha { color:var(--accent); font-size:18px; flex:none; }

h3.cap { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
  font-weight:700; margin:20px 0 2px; }
p.lead { color:var(--muted); font-size:13px; margin:0 0 10px; }

.consulta { display:flex; align-items:flex-start; gap:12px; background:var(--card);
  border:1px solid var(--line); border-radius:16px; padding:13px 15px; margin-bottom:10px;
  box-shadow:var(--sombra); }
.consulta .txt { flex:1; min-width:0; }
.consulta .txt b { display:block; font-size:14.5px; }
.consulta .txt small { display:block; color:var(--muted); font-size:12.5px; margin-top:3px; line-height:1.45; }

/* EL INTERRUPTOR, con las medidas exactas de `.sw` en ui.html: 46x28, perilla de 22 que corre
   18px, pista #D4D0E3 y el violeta de la marca al encender. Allá es un <label> con un
   <input type=checkbox>; acá es un <button role="switch">, así que el estado se lee de
   `aria-checked` en vez de `:checked`.

   ESTE CONTROL EXISTE DE VERDAD, y es la diferencia con el escritorio: `ModuleScreen.razor`
   recorre `EnabledTools()` y no ofrece nada para apagar. El tour de escritorio tuvo que quitar
   el interruptor que había dibujado; éste lo puede mostrar porque acá está. */
.sw { position:relative; width:46px; height:28px; flex:none; margin-top:2px; padding:0; border:0;
  border-radius:99px; background:none; cursor:default; }
.sw[data-vivo="1"] { cursor:pointer; }
.sw i { position:absolute; inset:0; border-radius:99px; background:#D4D0E3; transition:.18s; }
.sw i::before { content:""; position:absolute; width:22px; height:22px; border-radius:50%;
  background:#fff; top:3px; left:3px; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
.sw[aria-checked="true"] i { background:var(--accent); }
.sw[aria-checked="true"] i::before { transform:translateX(18px); }
@media (prefers-reduced-motion:reduce) { .sw i, .sw i::before { transition:none; } }

.apagada-nota { color:var(--muted); font-size:12.5px; margin:2px 2px 14px; }

/* ------------------------------------------------ el asistente, que acá es de Mymi */
.chat-cab { flex:none; display:flex; align-items:center; gap:10px; padding:10px 16px 12px; }
.chat-cab b { display:block; font-size:17px; letter-spacing:-.2px; }
.chat-cab small { display:block; color:var(--muted); font-size:12px; }
.msgs { flex:1; min-height:0; overflow-y:auto; padding:8px 14px 14px; display:flex;
  flex-direction:column; gap:10px; }
.msgs .vacio { margin:auto; text-align:center; color:var(--muted); font-size:13px; padding:0 20px; }
.burb { max-width:85%; padding:10px 13px; border-radius:16px; font-size:14px; line-height:1.5; }
.burb.yo { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
.burb.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line);
  border-bottom-left-radius:5px; }
.burb.bot.mal { border-left:3px solid var(--off); background:var(--off-soft); }
.pensando { align-self:flex-start; color:var(--muted); font-size:13px; font-style:italic; }
.traza { align-self:flex-start; max-width:88%; font-family:var(--mono); font-size:10.5px;
  color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:9px;
  padding:7px 9px; white-space:pre-wrap; word-break:break-word; }
.traza b { color:var(--ink); font-weight:600; }
.pregunta { flex:none; display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
  background:var(--card); }
.pregunta input { flex:1; min-width:0; border:1px solid var(--line); border-radius:999px;
  padding:9px 14px; font:inherit; font-size:13.5px; background:var(--paper); color:var(--ink); }
.sug { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px; }
.sug button { border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:7px 12px; font:inherit; font-size:12px; cursor:default; }
.sug button[data-vivo="1"] { cursor:pointer; color:var(--ink); }

/* ------------------------------------------------ la cara, a pantalla completa */
.carabar { flex:none; display:flex; align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--line); background:var(--card); }
.carabar .volver { padding:0; }
.carabar .quien { font-weight:700; font-size:14px; }
iframe.cara { display:block; width:100%; flex:1; min-height:0; border:0; background:#fff; }

/* ------------------------------------------------ la hoja que sube desde abajo */
.velo { position:absolute; inset:0; background:rgba(12,8,24,.42); z-index:30; }
.hoja { position:absolute; left:0; right:0; bottom:0; z-index:31; background:var(--card);
  border-radius:22px 22px 0 0; padding:8px 18px 22px; max-height:82%; overflow:auto;
  box-shadow:0 -10px 40px -10px rgba(0,0,0,.4); animation:subir .24s cubic-bezier(.2,.9,.3,1.05); }
@keyframes subir { from { transform:translateY(100%); } to { transform:none; } }
@media (prefers-reduced-motion:reduce) { .hoja { animation:none; } }
.hoja .agarre { width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
.hoja h2 { margin:0 0 4px; font-size:19px; letter-spacing:-.3px; }
.hoja .lead { color:var(--muted); font-size:13px; margin:0 0 14px; }
.hoja input[type=text] { width:100%; border:1px solid var(--line); border-radius:11px;
  padding:11px 13px; font:inherit; font-size:13.5px; background:var(--paper); color:var(--ink);
  margin-bottom:10px; }
.hoja .o { text-align:center; color:var(--muted); font-size:12px; margin:10px 0; }
.btn { display:block; width:100%; border:0; border-radius:13px; background:var(--accent);
  color:#fff; font:inherit; font-size:14.5px; font-weight:700; padding:13px; cursor:default;
  box-shadow:0 5px 16px rgba(108,75,217,.24); }
.btn[data-vivo="1"] { cursor:pointer; }
.btn.ghost { background:var(--paper); color:var(--accent); border:1px solid var(--accent);
  box-shadow:none; }
.revision { border:1px solid var(--line); border-radius:14px; background:var(--paper);
  padding:13px 15px; margin-bottom:14px; }
.revision .quien { display:flex; align-items:center; gap:11px; margin-bottom:11px; }
.revision .quien img { width:40px; height:40px; border-radius:12px; object-fit:contain;
  background:#fff; padding:4px; }
.revision dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:12.5px; }
.revision dt { color:var(--muted); }
.revision dd { margin:0; font-weight:600; text-align:right; }
.revision dd code { font-family:var(--mono); font-size:11.5px; font-weight:400; }
.firmado { display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft);
  color:var(--accent-ink); border-radius:999px; padding:3px 9px; font-size:11px; font-weight:700; }

/* ------------------------------------------------ la barra de abajo */
nav.tabs { flex:none; height:62px; display:flex; background:var(--card);
  border-top:1px solid var(--line); padding-bottom:6px; }
nav.tabs button { flex:1; border:0; background:none; color:var(--muted); font:inherit;
  font-size:10.5px; font-weight:700; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; cursor:default; padding:0; }
nav.tabs button[data-vivo="1"] { cursor:pointer; }
nav.tabs button.on { color:var(--accent); }
nav.tabs svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }

/* ------------------------------------------------ el guía */
.halo { position:absolute; z-index:50; border-radius:12px; pointer-events:none;
  box-shadow:0 0 0 3px var(--guia), 0 0 0 10px rgba(194,65,12,.26); animation:latir 1.5s ease-in-out infinite; }
@keyframes latir { 0%,100% { box-shadow:0 0 0 3px var(--guia), 0 0 0 9px rgba(194,65,12,.3); }
                   50% { box-shadow:0 0 0 3px var(--guia), 0 0 0 16px rgba(194,65,12,0); } }
@media (prefers-reduced-motion:reduce) { .halo { animation:none; } }

.globo { width:300px; background:#1c1430; color:#fff; border-radius:12px; padding:14px 16px;
  font-size:13px; line-height:1.5; box-shadow:0 12px 34px -8px rgba(0,0,0,.5); }
@media (max-width:820px) { .globo { width:min(390px,100%); } }
.globo b { color:#c4b5fd; font-weight:600; }
.globo code { font-family:var(--mono); font-size:11.5px; background:rgba(255,255,255,.12);
  padding:1px 4px; border-radius:3px; }
.globo .accion { display:block; margin-top:10px; font-size:11px; color:#c4b5fd; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; }
.globo .seguir { display:block; margin-top:12px; font-size:12.5px; font-weight:700; padding:8px 16px;
  border-radius:999px; border:0; background:#c4b5fd; color:#231544; cursor:pointer; }

/* ------------------------------------------------ pie */
.debajo { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:18px; }
.progreso { display:flex; gap:5px; }
.progreso i { width:20px; height:4px; border-radius:2px; background:var(--pagina-borde); display:block; }
.progreso i.hecho { background:var(--accent); }
.reiniciar { font:inherit; font-size:12.5px; color:var(--pagina-tenue); background:none; border:0;
  cursor:pointer; text-decoration:underline; padding:4px; }
.nota-pie { flex:1; min-width:260px; font-size:11.5px; color:var(--pagina-tenue); }
.nota-pie b { color:var(--pagina-tinta); }
.nota-pie code { font-family:var(--mono); font-size:11px; background:var(--pagina-hundido);
  padding:1px 4px; border-radius:3px; }
</style>

<div class="marco">

  <div class="titulo-fila">
    <h1 class="pag" id="pag-titulo">Mymi on the phone</h1>
    <span class="sub" id="pag-sub">from the module handover to the question</span>
    <button class="idioma" id="idioma" type="button">Español</button>
    <span class="sello">UI según trim/spike-wasm-mobile · 83b68be+ · 21/9/2026</span>
  </div>

  <div class="escena">
    <div class="aparato" id="aparato">
      <div class="isla"></div>
      <div class="pantalla" id="pantalla">

        <div class="estado">
          <span id="reloj">9:41</span>
          <span class="senal">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h3v4H2zM7 13h3v8H7zM12 9h3v12h-3zM17 4h3v17h-3z"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2.5"/><path d="M20 10.5v3"/></svg>
          </span>
        </div>

        <!-- LAS VISTAS. Son las de ui.html: `v-home`, `v-detail`, `v-chat`, `v-set`, más la cara
             a pantalla completa. Se prenden con la clase `on`, igual que allá. -->
        <div class="vista on" id="v-home"></div>
        <div class="vista" id="v-detail"></div>
        <div class="vista" id="v-chat"></div>
        <div class="vista" id="v-set"></div>
        <div class="vista" id="v-cara"></div>

        <div class="velo" id="velo" hidden></div>
        <div class="hoja" id="hoja" hidden></div>

        <nav class="tabs" id="tabs">
          <button data-tab="home" class="on" type="button">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span data-nav="inicio">Home</span></button>
          <button data-tab="chat" type="button">

      caja = caja.parentNode;
    }
  }

  function halo(el) {
    var p = $('pantalla').getBoundingClientRect(), r = el.getBoundingClientRect();
    var h = $('halo');
    h.hidden = false;
    h.style.left = (r.left - p.left - 4) + 'px';
    h.style.top = (r.top - p.top - 4) + 'px';
    h.style.width = (r.width + 8) + 'px';
    h.style.height = (r.height + 8) + 'px';
  }

  function señalar(el, texto, accion, alHacer) {
    apagar();
    if (!el) return;
    vivo = el;
    el.setAttribute('data-vivo', '1');
    el.onclick = function (e) { if (e) e.stopPropagation(); apagar(); alHacer(); };
    traerAlaVista(el);
    var g = $('globo');
    g.hidden = false;
    g.innerHTML = texto + (accion ? '<span class="accion">' + accion + '</span>' : '');
    halo(el);
  }

  function contar(texto, alSeguir) {
    apagar();
    var g = $('globo');
    g.hidden = false;
    g.innerHTML = texto + '<button class="seguir" type="button">' + t('seguir') + '</button>';
    g.querySelector('.seguir').onclick = function () { apagar(); alSeguir(); };
  }

  // ---------------------------------------------------------------- pintar

  function ir(v) {
    vista = v;
    Array.prototype.forEach.call(document.querySelectorAll('.vista'), function (x) {
      x.classList.toggle('on', x.id === 'v-' + v);
    });
    // Las pantallas de Ajustes encienden su pestaña; la cara no enciende ninguna, porque no es
    // una pestaña: es la app de la institución tomando el aparato.
    var pest = v === 'detail' ? 'home' : v;
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === pest);
    });
  }

  function pintar() {
    if (vista === 'cara') { pintarCara(); return; }
    pintarHome(); pintarDetalle(); pintarChat(); pintarSet();
  }

  function cuantas(n) { return n === 1 ? t('unaConectada') : con('nConectadas', { n: n }); }
  function permisos(n) { return n === 1 ? t('unPermiso') : con('nPermisos', { n: n }); }

  var CANDADO = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/>' +
                '<path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  function pintarHome() {
    $('v-home').innerHTML =
      '<div class="hoja-scroll">' +
        '<div class="top">' +
          '<div class="logo"><img src="mymi-mark.png" alt=""></div>' +
          '<div class="tt">Mymi</div>' +
          '<div class="ava">S</div>' +
        '</div>' +
        '<div class="hola">' +
          '<div class="t"><b>' + t('conexionesTitulo') + '</b><small>' +
          cuantas(instaladas.length) + '</small></div>' +
          '<button class="addbtn" id="conectar" type="button"><span>+</span><span>' +
          t('conectar') + '</span></button>' +
        '</div>' +
        '<div class="grid">' + instaladas.map(tarjeta).join('') + '</div>' +
      '</div>';
  }

  function tarjeta(id) {
    var m = inst(id);
    return '<div class="mod" style="--brand:' + m.color + ';--brand-soft:' + m.color + '1f">' +
      '<div class="head"><img class="ic" src="' + m.logo + '" alt="">' +
        '<div class="nm">' + (m.pre ? '<span class="pre">' + m.pre + '</span>' : '') +
        '<b>' + m.identidad + '</b></div></div>' +
      '<small>' + m.lema + '</small>' +
      '<div class="acts">' +
        '<button class="perm" data-perm="' + id + '" type="button">' + CANDADO +
        permisos(vivas(id).length) + '</button>' +
        '<button class="abrir" data-abrir="' + id + '" type="button">' + t('abrir') + '</button>' +
      '</div></div>';
  }

  function pintarDetalle() {
    if (!abierto) { $('v-detail').innerHTML = ''; return; }
    var m = inst(abierto);
    $('v-detail').innerHTML =
      '<div class="hoja-scroll">' +
        '<button class="volver" id="volver-lista" type="button">' + t('volverLista') + '</button>' +
        '<div class="det-marca" style="--brand-soft:' + m.color + '1f">' +
          '<img src="' + m.logo + '" alt="">' +
          '<div>' + (m.pre ? '<span class="pre">' + m.pre + '</span>' : '') +
          '<b>' + m.identidad + '</b></div>' +
        '</div>' +
        '<p class="det-lema">' + m.lema + '</p>' +

        '<div class="bloque"><button class="master" id="abrir-cara" type="button">' +
          '<span><b>' + con('abrirDe', { quien: m.identidad }) + '</b>' +
          '<small>' + t('abrirSub') + '</small></span>' +
          '<span class="flecha">→</span></button></div>' +

        // `m.retencion` y `m.refresco` NO pasan por `t()`: son la promesa que la institución
        // declaró en su manifiesto, y el Host no la traduce. El marco de la frase sí.
        '<div class="bloque"><div class="cap">' + t('tuRegistro') + '</div>' +
          '<div style="font-size:13px;color:var(--muted);line-height:1.5">' +
          con('registroDice', { retencion: m.retencion, refresco: m.refresco }) + '<br>' +
          con('registroDonde', { quien: m.identidad }) + '</div></div>' +

        '<h3 class="cap">' + con('consultasDe', { quien: m.identidad }) + '</h3>' +
        '<p class="lead">' + t('consultasLead') + '</p>' +
        m.consultas.map(function (c) { return consulta(abierto, c); }).join('') +
        '<p class="apagada-nota">' + t('consultasApagada') + '</p>' +
      '</div>';
  }

  // UNA CONSULTA CON SU INTERRUPTOR, que acá SÍ existe. En el teléfono el detalle muestra las dos
  // -- encendidas y apagadas -- porque es donde se deciden; en el escritorio `ModuleScreen.razor`
  // recorre `EnabledTools()` y la apagada ni aparece.
  function consulta(id, c) {
    var on = !apagadas[llave(id, c.nombre)];
    return '<div class="consulta">' +
      '<div class="txt"><b>' + c.titulo + '</b><small>' + c.desc + '</small></div>' +
      '<button class="sw" data-tool="' + c.nombre + '" role="switch" aria-checked="' + on + '" ' +
      'aria-label="' + c.titulo + '" type="button"><i></i></button>' +
    '</div>';
  }

  function pintarChat() {
    var cuerpo = turnos.length
      ? turnos.join('')
      : '<div class="vacio">' + t('asistenteVacio') + '</div>';
    $('v-chat').innerHTML =
      '<div class="chat-cab"><div><b>' + t('asistente') + '</b>' +
        '<small>' + t('asistenteSub') + '</small></div></div>' +
      '<div class="msgs" id="msgs">' + cuerpo + '</div>' +
      '<div class="sug">' +
        '<button data-q="resumen" type="button">' + t('q1') + '</button>' +
        '<button data-q="tendencia" type="button">' + t('q2') + '</button>' +
      '</div>' +
      '<div class="pregunta"><input type="text" placeholder="' + t('asistentePlaceholder') +
      '" disabled></div>';
    var m = $('msgs'); if (m) m.scrollTop = m.scrollHeight;
  }

  function pintarSet() {
    $('v-set').innerHTML =
      '<div class="hoja-scroll">' +
        '<div class="top"><div class="tt">' + t('ajustes') + '</div></div>' +
        '<div class="bloque"><div class="cap">' + t('ajustesQuien') + '</div>' +
          '<div style="font-weight:700;font-size:15px;margin-top:2px">Claude</div>' +
          '<div style="color:var(--muted);font-size:12.5px;margin-top:2px">' +
          '<code style="font-family:var(--mono);font-size:11.5px">claude-sonnet-5</code> · ' +
          'api.anthropic.com</div>' +
          '<div style="color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.5">' +
          t('ajustesLlave') + '</div></div>' +
      '</div>';
  }

  function pintarCara() {
    var m = inst(ESTA);
    $('v-cara').innerHTML =
      '<div class="carabar">' +
        '<button class="volver" id="volver-cara" type="button">←</button>' +
        '<span class="quien">' + m.identidad + '</span>' +
      '</div>' +
      // EL IDIOMA VIAJA AL APARATO, no a la cara: ver `cara/idioma-del-aparato.js`.
      '<iframe id="cara" class="cara" src="cara/index.html?lang=' + IDIOMA +
      '" title="' + m.identidad + '"></iframe>';
    marco = $('cara');
  }

  // ---------------------------------------------------------------- el asistente de Mymi
  //
  // ACÁ EL QUE PREGUNTA ES MYMI, no un programa de afuera. Ésa es la diferencia con el tour de
  // escritorio: allá Claude es otra app hablándole al Host por MCP; acá el bucle es de Mymi y el
  // modelo sólo redacta con lo que las instituciones contestaron. La traza -- «qué pasó por
  // debajo» -- es lo que hace visible esa diferencia.

  var PREGUNTAS = {
    resumen:   { dice: 'q1', tool: 'resumen' },
    tendencia: { dice: 'q2', tool: 'lista_de_examenes' }
  };

  var DE_RESERVA = {
    resumen: function () {
      return { hayDatos:true, examenes:16, analitosFueraDeRango:3, ultimoEventoLeido:1284 };
    },
    lista_de_examenes: function () {
      return { hayDatos:true, examenes:[
        { nombre:'Perfil lipídico', fecha:'2026-09-10',
          resultado:'Colesterol total 214 mg/dL · Colesterol LDL 96 mg/dL', aportaSerieContinua:true },
        { nombre:'Urianálisis', fecha:'2026-09-10',
          resultado:'Sangre en la orina positivo · Color de la orina ámbar oscuro',
          aportaSerieContinua:false },
        { nombre:'Hemograma', fecha:'2026-09-10',
          resultado:'Hemoglobina 14.1 g/dL', aportaSerieContinua:true }
      ] };
    }
  };

  function superficie(t) {
    try { var x = marco && marco.contentWindow.__tools; if (x && x[t]) return x[t]; } catch (e) {}
    return DE_RESERVA[t];
  }

  // LA FECHA VIAJA CON EL RENDER (regla 8): el JSON la trae ISO, y quien redacta la dice como se
  // dice en su idioma.
  function fechaLegible(iso) {
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(IDIOMA === 'en' ? 'en-GB' : 'es-CR',
      { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function redacta(cual, d) {
    if (cual === 'resumen')
      return con('r1', { examenes: d.examenes, fuera: d.analitosFueraDeRango,
                         evento: d.ultimoEventoLeido });

    // LA PUERTA SE ABRE Y AUN ASÍ NO ALCANZA. La lista trae filas de EXAMEN -- nombre, fecha,
    // resultado --; no la serie del analito en el tiempo, ni su unidad, ni el techo esperable, ni
    // el «nivel de siempre». Eso es `InterpretacionDeAnalito`, que es [View]: la dibuja la
    // pantalla del laboratorio y el modelo no la ve nunca.
    // `ultimo.nombre` y `ultimo.resultado` son dato del registro (regla 3) y NO se traducen: se
    // ven en español dentro de la frase inglesa, que es lo que pasa de verdad.
    var ultimo = d.examenes.reduce(function (a, b) { return b.fecha > a.fecha ? b : a; });
    return con('r2', { nombre: ultimo.nombre, fecha: fechaLegible(ultimo.fecha),
                       resultado: ultimo.resultado });
  }

  function preguntar(cual, alTerminar) {
    var q = PREGUNTAS[cual];
    turnos.push('<div class="burb yo">' + t(q.dice) + '</div>');
    turnos.push('<div class="pensando" id="pensando">' + t('pensando') + '</div>');
    pintarChat();

    setTimeout(function () {
      turnos.pop();

      if (apagadas[llave(ESTA, q.tool)]) {
        turnos.push('<div class="traza"><b>' + t('traza') + '</b>\n✕ examenes_' + q.tool +
          ' — ' + t('noEstaEnCatalogo') + '</div>');
        turnos.push('<div class="burb bot mal">' + t('rApagada') + '</div>');
        pintarChat();
        if (alTerminar) setTimeout(alTerminar, 900);
        return;
      }

      var d = superficie(q.tool)();
      turnos.push('<div class="traza"><b>' + t('traza') + '</b>\n⚒ examenes_' + q.tool +
        ' · local\n' + JSON.stringify(d).slice(0, 150) + (JSON.stringify(d).length > 150 ? '…' : '') +
        '</div>');
      turnos.push('<div class="pensando">' + t('redactando') + '</div>');
      pintarChat();

      setTimeout(function () {
        turnos.pop();
        turnos.push('<div class="burb bot">' + redacta(cual, d) + '</div>');
        pintarChat();
        if (alTerminar) setTimeout(alTerminar, 900);
      }, 800);
    }, 700);
  }

  // ---------------------------------------------------------------- la hoja del alta

  function abrirHoja() {
    $('velo').hidden = false;
    var h = $('hoja');
    h.hidden = false;
    h.innerHTML =
      '<div class="agarre"></div>' +
      '<h2>' + t('altaTitulo') + '</h2>' +
      '<p class="lead">' + t('altaLead') + '</p>' +
      '<input type="text" placeholder="' + t('altaPlaceholder') + '" disabled>' +
      '<button class="btn" type="button">' + t('altaAgregar') + '</button>' +
      '<p class="o">' + t('altaO') + '</p>' +
      '<button class="btn ghost" id="elegir" type="button">' + t('altaElegir') + '</button>';
  }

  // LA HOJA QUE MÁS DICE DE TODO EL PRODUCTO: qué trae, quién lo publica, qué promete sobre tu
  // registro y qué NO puede hacer. Todo del manifiesto que viaja adentro del .gmod.
  function revisar() {
    var m = inst(ESTA);
    $('hoja').innerHTML =
      '<div class="agarre"></div>' +
      '<h2>' + t('altaTitulo') + '</h2>' +
      '<p class="lead">' + con('altaTrae', { archivo:
        '<code style="font-family:var(--mono);font-size:12px">' + m.carpeta + '.gmod</code>' }) + '</p>' +
      '<div class="revision">' +
        '<div class="quien"><img src="' + m.logo + '" alt="">' +
          '<div>' + (m.pre ? '<span style="display:block;font-size:11.5px;color:var(--muted)">' +
          m.pre + '</span>' : '') +
          '<b style="font-size:18px">' + m.identidad + '</b>' +
          '<div style="color:var(--muted);font-size:12px">' + m.lema + '</div></div>' +
          '<span class="firmado" style="margin-left:auto">✓ ' + t('altaFirmado') + '</span>' +
        '</div>' +
        '<dl>' +
          '<dt>' + t('altaQuien') + '</dt><dd><code>' + m.dominio + '</code></dd>' +
          '<dt>' + t('altaVersion') + '</dt><dd>' + m.version + '</dd>' +
          '<dt>' + t('altaRed') + '</dt><dd>' + t('altaNo') + '</dd>' +
          '<dt>' + t('altaConsultas') + '</dt><dd>' + m.consultas.length + '</dd>' +
          '<dt>' + t('altaMotor') + '</dt><dd>' + t('altaPrestado') + '</dd>' +
          '<dt>' + t('altaRegistro') + '</dt><dd>' + m.retencion + '</dd>' +
          '<dt>' + t('altaTamano') + '</dt><dd>' + m.tamano + '</dd>' +
        '</dl>' +
      '</div>' +
      '<button class="btn" id="agregar" type="button">' + t('altaAgregar') + '</button>';
  }

  function cerrarHoja() { $('hoja').hidden = true; $('velo').hidden = true; }

  // ---------------------------------------------------------------- el recorrido

  var paso = 0, TOTAL = 10;

  function avanzar(n) {
    paso = n;
    Array.prototype.forEach.call($('progreso').children, function (i, k) {
      i.className = k < n ? 'hecho' : '';
    });
    ESCENA[n]();
  }

  function q(sel) { return $('pantalla').querySelector(sel); }

  var ESCENA = {
    // LAS CUATRO QUE YA ESTABAN, igual que en el tour de escritorio: cuatro rubros que no se
    // parecen en nada y una sola app sosteniéndolos. Acá se ve todavía mejor, porque en el
    // teléfono cada tarjeta ocupa el ancho entero y lleva su color arriba.
    0: function () {
      señalar(q('[data-perm="compras"]').closest('.mod'),
        t('g0'), t('g0a'), function () { avanzar(1); });
    },

    1: function () {
      señalar($('conectar'),
        t('g1'), t('g1a'), function () { abrirHoja(); avanzar(2); });
    },

    2: function () {
      señalar($('elegir'),
        t('g2'), t('altaElegir'), function () { revisar(); avanzar(3); });
    },

    3: function () {
      señalar($('agregar'),
        t('g3'), t('altaAgregar'), function () {
          cerrarHoja();
          if (instaladas.indexOf(ESTA) < 0) instaladas.unshift(ESTA);
          pintar();
          avanzar(4);
        });
    },

    // EN EL TELÉFONO LA TARJETA SE TOCA Y ABRE LA APP. No hay un paso intermedio: `gn.abrir` sale
    // del `onclick` de la tarjeta entera (ui.html:1604). El candado de al lado es el que lleva al
    // detalle, y ése es el camino del consentimiento -- viene después.
    4: function () {
      señalar(q('[data-abrir="' + ESTA + '"]'),
        t('g4'), t('abrir'), function () { ir('cara'); pintarCara(); avanzar(5); });
    },

    5: function () {
      contar(t('g5'),
        function () {
          señalar(q('#volver-cara'), t('g5a'), t('g5b'), function () {
            ir('home'); avanzar(6);
          });
        });
    },

    // Y ACÁ ESTÁ LA DIFERENCIA CON EL ESCRITORIO. Allá el que pregunta es Claude, otra app, por
    // MCP. Acá el asistente es de Mymi: mismo bucle, mismo Dispatcher, misma superficie -- pero
    // adentro. El modelo redacta; los hechos siguen siendo de las instituciones.
    6: function () {
      señalar(q('[data-tab="chat"]'),
        t('g6'), t('g6a'), function () { ir('chat'); avanzar(7); });
    },

    7: function () {
      señalar(q('[data-q="resumen"]'),
        t('g7'), t('g7a'), function () {
          preguntar('resumen', function () { avanzar(8); });
        });
    },

    8: function () {
      señalar(q('[data-q="tendencia"]'),
        t('g8'), t('g7a'), function () {
          preguntar('tendencia', function () { avanzar(9); });
        });
    },

    // EL CONSENTIMIENTO, Y ACÁ SÍ HAY DÓNDE TOCARLO. El tour de escritorio tuvo que sacar este
    // paso -- `ModuleScreen.razor` no tiene ningún control y en todo Gnothi.Desktop no hay un
    // `setTool` --. En el teléfono vive acá, en el detalle de la institución, con un interruptor
    // por consulta: `gn.setTool(modulo, tool, checked)` en ui.html.
    9: function () {
      ir('home');
      señalar(q('[data-perm="' + ESTA + '"]'),
        t('g9'), t('g9a'), function () {
          abierto = ESTA; pintarDetalle(); ir('detail');
          setTimeout(interruptor, 260);
        });
    }
  };

  function interruptor() {
    var sw = q('.sw[data-tool="lista_de_examenes"]');
    señalar(sw,
      t('gInterruptor'), t('gApagala'), function () {
        apagadas[llave(ESTA, 'lista_de_examenes')] = true;
        pintar();
        setTimeout(remate, 420);
      });
  }

  function remate() {
    contar(t('gRemate'),
      function () {
        ir('chat');
        señalar(q('[data-q="tendencia"]'), t('gOtraVez'), t('g7a'),
          function () { preguntar('tendencia', cierre); });
      });
  }

  function cierre() {
    contar(t('gCierre'),
      function () {
        ir('home');
        señalar(q('[data-abrir="' + ESTA + '"]'), t('gComprueba'), t('abrir'), function () {
          ir('cara'); pintarCara();
          Array.prototype.forEach.call($('progreso').children, function (i) { i.className = 'hecho'; });
          setTimeout(function () {
            contar(t('gIntacto'), function () {});
          }, 1400);
        });
      });
  }

  // ---------------------------------------------------------------- cableado

  // LOS CLICS VAN POR DELEGACIÓN, y tiene que ser así: cada `pintar()` reemplaza el HTML entero
  // de la vista, y un `onclick` puesto sobre un nodo viejo se va con él. El guía pone el suyo
  // sobre el nodo que señala en ese momento; esto es para todo lo demás.
  $('pantalla').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t && t.getAttribute('data-vivo') === '1') return;   // lo maneja el guía
  });

  for (var i = 0; i < TOTAL; i++) $('progreso').appendChild(document.createElement('i'));

  function desdeCero() {
    apagar();
    instaladas = ['compras', 'cargas', 'dealership', 'municipalidad'];
    apagadas = {}; abierto = null; marco = null; turnos = [];
    cerrarHoja();
    pintar(); ir('home');
    avanzar(0);
  }

  $('reiniciar').addEventListener('click', desdeCero);

  // LO QUE ESTÁ FUERA DEL TELÉFONO también cambia: título, pie, botones y las tres pestañas de la
  // barra de abajo, que son marcado fijo y no las repinta `pintar()`.
  function pintarPagina() {
    document.documentElement.lang = IDIOMA;
    document.title = t('pagTitulo');
    $('pag-titulo').textContent = t('pagTitulo');
    $('pag-sub').textContent = t('pagSub');
    $('idioma').textContent = t('idiomaBoton');
    $('reiniciar').textContent = t('reiniciar');
    $('nota-pie').innerHTML = t('pie');
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (s) {
      s.textContent = t(s.getAttribute('data-nav'));
    });
  }

  // CAMBIAR DE IDIOMA REINICIA EL RECORRIDO: los globos ya dichos quedarían en el idioma viejo, y
  // media conversación del asistente traducida a mitad de camino sería un aparato que no existe.
  $('idioma').addEventListener('click', function () {
    IDIOMA = IDIOMA === 'en' ? 'es' : 'en';
    pintarPagina();
    desdeCero();
  });

  // EL RELOJ SIGUE AL IDIOMA DEL APARATO (regla 8): el formato viaja con el render.
  function hora() {
    var d = new Date();
    $('reloj').textContent = d.toLocaleTimeString(IDIOMA === 'en' ? 'en-GB' : 'es-CR',
      { hour:'2-digit', minute:'2-digit' });
  }
  hora(); setInterval(hora, 20000);

  pintarPagina();
  pintar();
  avanzar(0);
})();
</script>
