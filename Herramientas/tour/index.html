<title>Mymi en el escritorio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  --pagina:#ece9f4; --pagina-tinta:#241F3D; --pagina-tenue:#6F6B85; --pagina-borde:#ddd8ec;
  --pagina-panel:#fff; --pagina-hundido:#e4dff2;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* La paleta de Mymi, tal cual sale de Gnothi.Desktop/wwwroot/index.html. La misma del
     teléfono: dos violetas casi iguales se leen como un error de imprenta. */
  --ink:#241F3D; --soft:#6F6B85; --line:#E7E4F2; --bg:#fff; --panel:#F8F6FD;
  --brand:#6C4BD9; --brand-dark:#4A2FB0; --warn:#8a6d1f; --warn-bg:#fdf8e7; --danger:#b4232a;
  --guia:#c2410c;
}
[hidden] { display:none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pagina:#120f1c; --pagina-tinta:#EDEAF6; --pagina-tenue:#A29DBA; --pagina-borde:#2b2540;
    --pagina-panel:#1b1729; --pagina-hundido:#171327;
  }
}
:root[data-theme="dark"] {
  --pagina:#120f1c; --pagina-tinta:#EDEAF6; --pagina-tenue:#A29DBA; --pagina-borde:#2b2540;
  --pagina-panel:#1b1729; --pagina-hundido:#171327;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--pagina); color:var(--pagina-tinta);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.marco { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:18px 30px; }

.titulo-fila { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:12px; }
h1.pag { font-size:18px; font-weight:700; letter-spacing:-.2px; margin:0; }
.titulo-fila .sub { font-size:13px; color:var(--pagina-tenue); }
.titulo-fila .sello { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--pagina-tenue); white-space:nowrap; }
/* EL SELECTOR ES DE LA LÁMINA, no del producto: el Host de verdad NEGOCIA con la persona y no
   tiene un botón de idioma. Acá hace falta porque quien muestra la lámina elige en el momento. */
.idioma { font:inherit; font-size:12px; font-weight:600; padding:4px 12px; border-radius:999px;
  border:1px solid var(--pagina-borde); background:var(--pagina-panel); color:var(--pagina-tenue);
  cursor:pointer; }
.idioma:hover { color:var(--pagina-tinta); border-color:var(--pagina-tenue); }

/* ============================================================ el monitor */
.monitor { position:relative; border-radius:14px; overflow:hidden;
  border:1px solid rgba(0,0,0,.3); box-shadow:0 2px 6px rgba(20,12,40,.2), 0 30px 64px -30px rgba(20,12,40,.62);
  aspect-ratio:16/10; min-height:580px; }
@media (max-width:820px) { .monitor { aspect-ratio:auto; height:80vh; min-height:540px; } }

.escritorio { position:absolute; inset:0; overflow:hidden; font-size:13px;
  background:
    radial-gradient(120% 90% at 84% 6%, #5b3fa8 0%, rgba(91,63,168,0) 58%),
    radial-gradient(85% 75% at 6% 96%, #2f2a6b 0%, rgba(47,42,107,0) 62%),
    linear-gradient(152deg, #241f47 0%, #1d1938 54%, #14111f 100%); }
.escritorio::after { content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(112deg, transparent 37%, rgba(255,255,255,.05) 38%, transparent 42%),
    linear-gradient(112deg, transparent 57%, rgba(255,255,255,.035) 58%, transparent 60%); }

/* ------------------------------------------------ íconos */
.iconos { position:absolute; top:14px; left:14px; display:grid; gap:4px; width:100px; z-index:2; }
.icono { display:grid; justify-items:center; gap:5px; padding:8px 4px 7px; width:100px;
  background:none; border:1px solid transparent; border-radius:6px; cursor:default;
  font:inherit; font-size:11.5px; color:#fff; text-align:center; line-height:1.25; }
.icono[data-vivo="1"] { cursor:pointer; }
.icono[data-vivo="1"]:hover, .icono:focus-visible { background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.3); outline:none; }
.icono .glifo { width:44px; height:44px; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.icono .nombre { text-shadow:0 1px 3px rgba(0,0,0,.8); word-break:break-all; }

/* ------------------------------------------------ barra de tareas */
.tareas { position:absolute; left:0; right:0; bottom:0; height:44px; z-index:5;
  display:flex; align-items:center; padding:0 12px;
  background:rgba(255,255,255,.7); backdrop-filter:blur(18px); border-top:1px solid rgba(255,255,255,.5); }
.tareas-centro { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
.tarea { width:34px; height:30px; border-radius:6px; display:grid; place-items:center; border:0; background:none; cursor:default; padding:0; position:relative; box-shadow:none; }
.tarea.abierta { background:rgba(36,31,61,.09); }
.tarea.abierta::after { content:""; position:absolute; bottom:1px; left:50%; transform:translateX(-50%); width:14px; height:2.5px; border-radius:2px; background:var(--brand); }
.tarea svg { width:20px; height:20px; }
.reloj { margin-left:auto; font-size:11.5px; color:#2c2547; text-align:right; line-height:1.2; font-variant-numeric:tabular-nums; }

/* ============================================================ la ventana de Mymi
   Todo lo de acá abajo sale de Gnothi.Desktop/wwwroot/index.html y sus .razor. */
.win { position:absolute; z-index:3; background:var(--bg); color:var(--ink); border-radius:9px; overflow:hidden;
  border:1px solid rgba(0,0,0,.32); box-shadow:0 20px 54px -12px rgba(0,0,0,.62);
  display:flex; flex-direction:column; animation:abrir .22s cubic-bezier(.2,.9,.3,1.1); }
@keyframes abrir { from { opacity:0; transform:scale(.965) translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .win { animation:none; } }
/* El escritorio tiene tres franjas y ninguna se pisa: los íconos a la izquierda (hasta ~13%),
   las ventanas en el medio, y la columna del globo del guía a la derecha. */
#ventana { top:4%; left:13%; width:58%; height:84%; }
@media (max-width:820px) { #ventana { top:2%; left:2%; width:96%; height:88%; } }

.crudo-titulo { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel);
  border-bottom:1px solid var(--line); flex:none; font-size:12px; color:var(--soft); }
.crudo-titulo .botones { margin-left:auto; display:flex; gap:2px; }
.crudo-titulo .botones span { width:28px; height:20px; display:grid; place-items:center; border-radius:4px; font-size:11px; }

.win-scroll { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }

.mymi-header { border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:12px; flex:none; }
.mymi-header .cara { width:56px; height:56px; display:block; }
.mymi-header .brand { font-weight:700; font-size:22px; letter-spacing:-.4px; }

nav.tabs { display:flex; gap:4px; padding:0 22px; border-bottom:1px solid var(--line); flex:none; }
nav.tabs button { background:none; border:none; border-bottom:2px solid transparent; color:var(--soft);
  border-radius:0; padding:11px 14px; font:inherit; font-weight:600; font-size:14px; box-shadow:none; cursor:default; }
nav.tabs button[data-vivo="1"] { cursor:pointer; }
nav.tabs button[data-vivo="1"]:hover { color:var(--ink); }
nav.tabs button.active { color:var(--brand); border-bottom-color:var(--brand); }

main { padding:22px; max-width:900px; }
h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.3px; }
p.sub { color:var(--soft); margin:0 0 20px; }

.card { border:1px solid var(--line); border-radius:10px; padding:16px 18px; background:var(--panel);
  margin-bottom:12px; border-left:4px solid var(--marca,var(--brand)); }
.card.off { opacity:.55; }
.query.dim { opacity:.5; }
.row { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.quien { display:flex; align-items:center; gap:14px; min-width:0; }
.marca { width:42px; height:42px; flex:none; object-fit:contain; border-radius:9px; }
.title { font-weight:600; }
.lema { color:var(--soft); font-size:13px; margin-top:1px; }
.meta { color:var(--soft); font-size:13px; }
.empty { color:var(--soft); text-align:center; padding:36px 20px; }
.crumb { color:var(--soft); font-size:13px; margin:0 0 14px; }
.crumb button.link { background:none; border:none; color:var(--brand); padding:0; font-weight:600; box-shadow:none; }
.query { border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:12px; }
.query .desc { color:var(--soft); font-size:13px; margin:2px 0 8px; }

/* NO HAY REGLA `.switch`, y su ausencia es la corrección: la v14 dibujó un interruptor por
   consulta en la pantalla del escritorio, y en el escritorio ese control NO EXISTE.
   `ModuleScreen.razor` recorre `EnabledTools()` —ya filtrado— y no ofrece nada para apagar; el
   consentimiento por consulta se cambia desde el teléfono. El CSS que lo pintaba se quitó en la
   v17 junto con el botón. */
.query .field { display:block; color:var(--soft); font-size:12px; margin:8px 0 4px; }

button { font:inherit; font-weight:600; font-size:14px; border-radius:999px; cursor:default;
  padding:9px 18px; border:1px solid transparent; background:var(--brand); color:#fff;
  box-shadow:0 4px 12px rgba(108,75,217,.22); }
button[data-vivo="1"] { cursor:pointer; }
button[data-vivo="1"]:hover { background:var(--brand-dark); }
button.ghost { background:transparent; color:var(--brand); border-color:var(--brand); box-shadow:none; }
button.ghost[data-vivo="1"]:hover { background:rgba(108,75,217,.08); }
button.small { padding:5px 11px; font-size:13px; }
input[type=text] { font:inherit; font-size:14px; padding:6px 10px; border:1px solid var(--line);
  border-radius:6px; background:var(--bg); color:var(--ink); min-width:190px; }
pre { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:11px 13px;
  font:12px/1.5 var(--mono); white-space:pre-wrap; overflow-x:auto; margin:10px 0 0; }
.notice { border:1px solid var(--line); border-left:3px solid var(--warn); background:var(--warn-bg);
  border-radius:7px; padding:11px 14px; font-size:13px; margin-bottom:12px; }
.denied { border-left-color:var(--danger); }

/* la cara adentro de la ventana */
.carabar { display:flex; gap:14px; align-items:center; padding:9px 18px; border-bottom:1px solid var(--line);
  background:var(--panel); flex:none; }
.carabar .meta { margin-left:auto; }
iframe.cara { display:block; width:100%; flex:1; min-height:0; border:0; background:#fff; }

/* asistente */
.chat { display:flex; flex-direction:column; gap:8px; margin:8px 0 16px; min-height:120px; }
.bubble { max-width:78%; padding:9px 13px; border-radius:12px; font-size:14px; white-space:pre-wrap; word-wrap:break-word; }
.bubble.me { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
.bubble.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
.bubble.bot.fail { border-left:3px solid var(--danger); color:var(--danger); }
.trace-label { align-self:flex-start; color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
.trace { align-self:flex-start; max-width:82%; color:var(--soft); font-size:12px; font-family:var(--mono);
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 9px; white-space:pre-wrap; word-wrap:break-word; }
.ask { display:flex; gap:8px; align-items:center; }
.ask input[type=text] { flex:1; }

/* ------------------------------------------------ Claude, la app de afuera
   Recreación sobria: lo que importa no es su estética sino que es OTRO programa, de otra gente,
   hablándole al Host por MCP. */
#claude { top:9%; left:19%; width:56%; height:80%; z-index:4; --cl:#d97757; }
@media (max-width:820px) { #claude { top:5%; left:2%; width:96%; height:84%; } }
.cl-hoja { flex:1; min-height:0; overflow:auto; background:#faf8f5; color:#2b2724; padding:16px 18px; }
.cl-hoja .cl-vacio { color:#8a7f76; font-size:13.5px; text-align:center; padding:30px 10px; }
.cl-turno { display:grid; gap:10px; margin-bottom:16px; }
.cl-yo { align-self:flex-end; justify-self:end; max-width:80%; background:#efe9e2; border-radius:12px; padding:9px 13px; font-size:14px; }
.cl-dice { font-size:14px; line-height:1.6; max-width:68ch; }
.cl-mcp { border:1px solid #e3d9cf; border-radius:9px; background:#fff; overflow:hidden; max-width:560px; }
.cl-mcp-cab { display:flex; align-items:center; gap:8px; padding:8px 11px; font-size:12.5px; color:#6d6259; background:#f6f1ea; }
.cl-mcp-cab b { color:#2b2724; font-weight:600; font-family:var(--mono); font-size:12px; }
.cl-mcp-cab .pin { margin-left:auto; font-size:11px; color:#8a7f76; }
.cl-mcp-cuerpo { padding:9px 11px; font-family:var(--mono); font-size:11.5px; color:#6d6259; white-space:pre-wrap; word-break:break-word; border-top:1px solid #efe7de; }
.cl-mcp.mal { border-color:#e0b4ac; }
.cl-mcp.mal .cl-mcp-cab { background:#fbeeea; color:#a2432f; }
.cl-pensando { color:#8a7f76; font-size:13.5px; font-style:italic; }
.cl-pie { flex:none; border-top:1px solid #e9e1d8; background:#faf8f5; padding:10px 14px; display:grid; gap:8px; }
.cl-caja { display:flex; gap:8px; align-items:center; border:1px solid #e0d6cb; border-radius:10px; background:#fff; padding:8px 10px; }
.cl-caja input { flex:1; min-width:0; border:0; outline:none; font:inherit; font-size:13.5px; background:none; color:#2b2724; }
.cl-enchufe { display:flex; align-items:center; gap:7px; font-size:11.5px; color:#6d6259; }
.cl-enchufe .bolita { width:7px; height:7px; border-radius:50%; background:#2f9e68; flex:none; }
.cl-enchufe b { font-family:var(--mono); font-size:11px; color:#2b2724; font-weight:600; }
.cl-sug { display:flex; flex-wrap:wrap; gap:6px; }
.cl-sug button { font:inherit; font-size:12px; font-weight:400; padding:6px 11px; border-radius:99px;
  border:1px solid #e0d6cb; background:#fff; color:#6d6259; box-shadow:none; cursor:default; }
.cl-sug button[data-vivo="1"] { cursor:pointer; color:#2b2724; }
.cl-sug button[data-vivo="1"]:hover { border-color:var(--cl); color:var(--cl); background:#fff; }

/* ------------------------------------------------ diálogo */
.velo { position:absolute; inset:0; background:rgba(12,8,24,.45); z-index:6; }
/* CENTRADO SIN `transform`, y no es una preferencia: la animación de apertura anima `transform`,
   así que durante esos 200 ms el translate(-50%,-50%) del centrado NO está puesto. Medir el
   diálogo ahí devuelve un rectángulo corrido media pantalla, y el halo del guía terminaba
   señalando aire. `inset:0` + `margin:auto` centra sin tocar el transform. */
.dlg { position:absolute; z-index:7; top:0; bottom:0; left:13%; right:29%; margin:auto; height:max-content;
  width:min(430px,92%); background:var(--bg); color:var(--ink); border-radius:12px; overflow:hidden;
  border:1px solid rgba(0,0,0,.3); box-shadow:0 24px 64px -14px rgba(0,0,0,.66);
  animation:aparecer .2s ease-out; }
@keyframes aparecer { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion:reduce) { .dlg { animation:none; } }
.dlg-cuerpo { padding:18px; }
.dlg h2 { margin:0 0 4px; font-size:18px; letter-spacing:-.3px; }
.dlg .lead { color:var(--soft); font-size:13.5px; margin:0 0 14px; }
.dlg .fila-alta { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.dlg .fila-alta input { flex:1; min-width:0; }
.dlg .o { text-align:center; color:var(--soft); font-size:12px; margin:10px 0; }
.revision { border:1px solid var(--line); border-radius:9px; padding:13px 15px; background:var(--panel); }
.revision .quien { margin-bottom:10px; }
.revision dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:12.5px; }
.revision dt { color:var(--soft); }
.revision dd { margin:0; font-weight:600; }
.revision dd code { font-family:var(--mono); font-size:11.5px; font-weight:400; }
.dlg-pie { display:flex; justify-content:flex-end; gap:8px; padding:13px 18px; background:var(--panel); border-top:1px solid var(--line); }

/* ------------------------------------------------ el guía */
.halo { position:absolute; z-index:20; border-radius:9px; pointer-events:none;
  box-shadow:0 0 0 3px var(--guia), 0 0 0 10px rgba(194,65,12,.26); animation:latir 1.5s ease-in-out infinite; }
@keyframes latir { 0%,100% { box-shadow:0 0 0 3px var(--guia), 0 0 0 9px rgba(194,65,12,.3); }
                   50% { box-shadow:0 0 0 3px var(--guia), 0 0 0 16px rgba(194,65,12,0); } }
@media (prefers-reduced-motion:reduce) { .halo { animation:none; } }
.globo { position:absolute; z-index:21; width:min(270px, 26%); background:#1c1430; color:#fff; border-radius:10px;
  padding:12px 14px; font-size:12.5px; line-height:1.45; box-shadow:0 12px 34px -8px rgba(0,0,0,.66); }
.globo b { color:#c4b5fd; font-weight:600; }
.globo code { font-family:var(--mono); font-size:11.5px; background:rgba(255,255,255,.12); padding:1px 4px; border-radius:3px; }
.globo .accion { display:block; margin-top:8px; font-size:11px; color:#c4b5fd; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
.globo .seguir { margin-top:10px; font-size:12px; font-weight:600; padding:6px 14px; border-radius:999px;
  border:0; background:#c4b5fd; color:#231544; cursor:pointer; box-shadow:none; }
.globo .punta { display:none; }

/* ------------------------------------------------ pie */
.debajo { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:14px; }
.progreso { display:flex; gap:5px; }
.progreso i { width:20px; height:4px; border-radius:2px; background:var(--pagina-borde); display:block; }
.progreso i.hecho { background:var(--brand); }
.reiniciar { font:inherit; font-size:12.5px; color:var(--pagina-tenue); background:none; border:0; cursor:pointer;
  text-decoration:underline; padding:4px; box-shadow:none; border-radius:0; font-weight:400; }
.nota-pie { flex:1; min-width:260px; font-size:11.5px; color:var(--pagina-tenue); }
.nota-pie b { color:var(--pagina-tinta); }
.nota-pie code { font-family:var(--mono); font-size:11px; background:var(--pagina-hundido); padding:1px 4px; border-radius:3px; }
</style>

<div class="marco">

  <div class="titulo-fila">
    <h1 class="pag" id="pag-titulo">Mymi on the desktop</h1>
    <span class="sub" id="pag-sub">from the module handover to the question</span>
    <button class="idioma" id="idioma" type="button">Español</button>
    <!-- EL SELLO DEL SNAPSHOT. El `+` no es adorno: la cara copiada incluye tres archivos
         arreglados que en ese commit todavía no están, y un sello que dijera el commit pelado
         estaría señalando un código que no es el que se ve. -->
    <span class="sello">UI según trim/spike-wasm-mobile · 83b68be+ · 21/9/2026</span>
  </div>

  <div class="monitor">
    <div class="escritorio" id="escritorio">

      <div class="iconos">
        <button class="icono" id="ic-mymi" type="button">
          <img class="glifo" src="mymi.png" alt="">
          <span class="nombre">Mymi</span>
        </button>

        <button class="icono" id="ic-gmod" type="button">
          <svg class="glifo" viewBox="0 0 44 44" aria-hidden="true">
            <path d="M22 4l16 8v20l-16 8-16-8V12z" fill="#3d3568"/>
            <path d="M22 4l16 8-16 8-16-8z" fill="#544a86"/>
            <path d="M22 20v20l-16-8V12z" fill="#332c5a"/>
            <path d="M14.5 26.5h15" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
          <span class="nombre">examenes.gmod</span>
        </button>

        <button class="icono" id="ic-claude" type="button">
          <svg class="glifo" viewBox="0 0 44 44" aria-hidden="true">
            <rect x="2" y="2" width="40" height="40" rx="11" fill="#f6ede8"/>
            <g stroke="#d97757" stroke-width="2.6" stroke-linecap="round">
              <path d="M22 11v22M11 22h22M14.2 14.2l15.6 15.6M29.8 14.2L14.2 29.8"/>
            </g>
          </svg>
          <span class="nombre">Claude</span>
        </button>

      </div>

      <div class="velo" id="velo" hidden></div>
      <div id="ventana" class="win" hidden></div>
      <div id="claude" class="win" hidden></div>
      <div id="dlg" class="dlg" hidden></div>

      <div class="tareas">
        <div class="tareas-centro">
          <button class="tarea" type="button" aria-label="Inicio">
            <svg viewBox="0 0 20 20" aria-hidden="true"><g fill="#3a3161"><rect x="2" y="2" width="7.2" height="7.2" rx="1"/><rect x="10.8" y="2" width="7.2" height="7.2" rx="1"/><rect x="2" y="10.8" width="7.2" height="7.2" rx="1"/><rect x="10.8" y="10.8" width="7.2" height="7.2" rx="1"/></g></svg>
          </button>

  function hora() {

      '<br>' + d.toLocaleDateString('es-CR');
  }
  hora(); setInterval(hora, 20000);

  // ---------------------------------------------------------------- el guía
  var vivo = null;

  function apagar() {
    if (vivo) { vivo.removeAttribute('data-vivo'); vivo.onclick = null; vivo = null; }
    $('halo').hidden = true; $('globo').hidden = true;
  }

  // TRAERLO A LA VISTA PRIMERO. La ventana scrollea por dentro, así que un botón de más abajo
  // existe pero no se ve: señalarlo sin esto deja el halo fuera de cuadro y el globo pegado al
  // borde. Se sube por los ancestros hasta el que scrollea y se lo centra.
  function traerAlaVista(el) {
    var caja = el.parentNode;
    while (caja && caja.nodeType === 1) {
      // SOLO un contenedor que scrollea DE VERDAD. `.escritorio` es overflow:hidden y aun así
      // acepta scrollTop por código: moverlo corría el escritorio entero y dejaba el halo
      // apuntando a un rectángulo vacío mientras el botón seguía en su lugar.
      var ov = getComputedStyle(caja).overflowY;
      if ((ov === 'auto' || ov === 'scroll') && caja.scrollHeight > caja.clientHeight + 4) {
        var r = el.getBoundingClientRect(), c = caja.getBoundingClientRect();
        caja.scrollTop += (r.top - c.top) - (c.height / 2) + (r.height / 2);
        return;
      }
      caja = caja.parentNode;
    }
  }

  // EL GLOBO TIENE COLUMNA PROPIA, a la derecha, y las ventanas se corrieron para dejársela.
  // Calcular un lado libre alrededor de cada objetivo no funcionó: la ventana ocupa casi todo el
  // escritorio, así que cualquier lado que quepa tapa algo que hay que leer -- el botón de al
  // lado, el título del bloque. Una columna fija no tapa nunca y siempre está en el mismo lugar,
  // que además es más fácil de seguir con la vista.
  function colocarGlobo(r, esc) {
    var g = $('globo'), gh = g.offsetHeight;
    var cy = (r.top - esc.top) + r.height / 2;
    g.style.left = '';
    g.style.right = '16px';
    // arrimado al objetivo en vertical, pero siempre entero adentro y sin pisar la barra.
    g.style.top = Math.max(14, Math.min(cy - gh / 2, esc.height - gh - 58)) + 'px';
  }

  function colocarGloboViejo(r, esc, lado) {
    var g = $('globo'), gw = g.offsetWidth, gh = g.offsetHeight, punta = g.querySelector('.punta');
    var x = r.left - esc.left, y = r.top - esc.top;
    var pos = lado || (x + r.width + 20 + gw < esc.width ? 'der' : 'abajo');
    if (pos === 'der') {
      g.style.left = (x + r.width + 16) + 'px';
      g.style.top = Math.max(8, Math.min(y + r.height/2 - gh/2, esc.height - gh - 52)) + 'px';
      punta.style.left = '-5px'; punta.style.top = '18px';
    } else if (pos === 'izq') {
      g.style.left = Math.max(8, x - gw - 16) + 'px';
      g.style.top = Math.max(8, Math.min(y + r.height/2 - gh/2, esc.height - gh - 52)) + 'px';
      punta.style.left = (gw - 6) + 'px'; punta.style.top = '18px';
    } else if (pos === 'arriba') {
      g.style.left = Math.max(8, Math.min(x + r.width/2 - gw/2, esc.width - gw - 8)) + 'px';
      g.style.top = Math.max(8, y - gh - 14) + 'px';
      punta.style.left = (gw/2 - 5) + 'px'; punta.style.top = (gh - 6) + 'px';
    } else {
      g.style.left = Math.max(8, Math.min(x + r.width/2 - gw/2, esc.width - gw - 8)) + 'px';
      g.style.top = Math.min(y + r.height + 14, esc.height - gh - 52) + 'px';
      punta.style.left = (gw/2 - 5) + 'px'; punta.style.top = '-5px';
    }

    // EL CIERRE, y faltaba: los cuatro lados clampean lo suyo y ninguno clampeaba los dos ejes.
    // El monitor recorta, así que un globo que se pasa no se ve "corrido": se ve mordido, con la
    // línea de la acción cortada por el borde -- que es justo lo que hay que leer.
    g.style.left = Math.max(8, Math.min(parseFloat(g.style.left), esc.width - gw - 8)) + 'px';
    g.style.top  = Math.max(8, Math.min(parseFloat(g.style.top),  esc.height - gh - 52)) + 'px';
  }

  function señalar(el, texto, accion, alHacer, lado) {
    apagar();
    if (!el) return;
    vivo = el;

    halo.style.left = (r.left - esc.left - 4) + 'px'; halo.style.top = (r.top - esc.top - 4) + 'px';
    halo.style.width = (r.width + 8) + 'px'; halo.style.height = (r.height + 8) + 'px';

    var g = $('globo');
    g.hidden = false;
    g.innerHTML = texto + (accion ? '<span class="accion">' + accion + '</span>' : '') + '<span class="punta"></span>';
    colocarGlobo(r, esc, lado);

    // EL CONSENTIMIENTO NO SE CAMBIA ACÁ, y ese es el punto del paso.
    //
    // Hasta la v16 este paso dibujaba un interruptor por consulta en la pantalla del escritorio y
    // le pedía a la persona que lo apretara. En el escritorio ese control NO EXISTE: se verificó
    // contra `ModuleScreen.razor`, que recorre `EnabledTools()` y no ofrece nada para apagar, y
    // contra todo `Gnothi.Desktop`, donde no hay un `setTool` ni un `role="switch"`. El
    // interruptor por consulta vive en el teléfono.
    //
    // Así que el paso muestra EL EFECTO en vez del control -- y resulta más fuerte, porque el
    // efecto es doble y sale de una sola decisión: la consulta apagada desaparece de la pantalla
    // de Mymi *y* del catálogo del asistente. `EnabledTools()` filtra para las dos puertas.
    9: function () {
      $('claude').hidden = true;
      $('tarea-claude').classList.remove('abierta');
      apagadas[llave(ESTA, 'lista_de_examenes')] = true;
      vista = 'conexiones'; abierto = ESTA; pintar();

      contar(t('g9'), $('ventana'), function () { remate(); }, 'izq');
    }
  };

  // ---------------------------------------------------------------- Claude, la app de afuera

  // LO QUE CLAUDE ENCUENTRA al conectarse: dos del Host, y una por cada [Query] encendida de
  // CADA institución instalada. El nombre público es `modulo_tool` -- `Module.PublicName`
  // (Module.cs:101) --, y por eso los cinco `resumen` no chocan entre sí.
  //
  // Con las cinco instituciones y sus dos consultas: 2 + 10 = doce.
  function herramientas() {
    var t = ['gnothi_installed_modules', 'gnothi_verify_module'];
    instaladas.forEach(function (id) {
      vivas(id).forEach(function (c) { t.push(id + '_' + c.nombre); });
    });
    return t;
  }

  function abrirClaude() {
    $('claude').hidden = false;
    $('tarea-claude').classList.add('abierta');
    pintarClaude();
  }

  // La variable local se llamaba `t` -- el array de herramientas -- y desde que existe la función
  // `t()` de los textos la tapaba entera adentro de esta función. Acá SÍ mordía: `t('clTitulo')`
  // sobre un array revienta.
  function pintarClaude() {
    var tools = herramientas();
    $('claude').innerHTML =
      '<div class="crudo-titulo"><span>' + t('clTitulo') + '</span>' +
        '<span class="botones"><span>—</span><span>▢</span><span>✕</span></span></div>' +
      '<div class="cl-hoja" id="cl-hoja">' +
        '<div class="cl-vacio">' + t('clVacio') + '</div></div>' +
      '<div class="cl-pie">' +
        '<div class="cl-enchufe"><span class="bolita"></span>' +
          con('clConectado', { n: tools.length }) + '</div>' +
        '<div class="cl-caja"><input type="text" placeholder="' + t('clPlaceholder') + '" disabled>' +
          '<span style="color:#b9ada2">↑</span></div>' +
        '<div class="cl-sug">' +
          '<button data-q="resumen" type="button">' + t('q1') + '</button>' +
          '<button data-q="tendencia" type="button">' + t('q2') + '</button>' +
        '</div>' +
      '</div>';
  }

  // LAS DOS PREGUNTAS, y cada una con la tool que le toca. La primera cae justo adentro de lo que
  // el laboratorio ofrece; la segunda usa la MISMA puerta y aun así se queda corta, que es el
  // punto entero del recorrido.
  // LO QUE LA PERSONA PREGUNTA se traduce: es la voz de quien usa el aparato, no la de nadie más.
  var PREGUNTAS = {
    resumen:   { dice: 'q1', tool: 'resumen' },
    tendencia: { dice: 'q2', tool: 'lista_de_examenes' }
  };

  function responderClaude(cual) {
    var q = PREGUNTAS[cual], h = $('cl-hoja');
    if (h.querySelector('.cl-vacio')) h.innerHTML = '';

    var turno = document.createElement('div');
    turno.className = 'cl-turno';
    turno.innerHTML = '<div class="cl-yo">' + t(q.dice) + '</div>' +
      '<div class="cl-pensando">' + t('clPensando') + '</div>';
    h.appendChild(turno);
    h.scrollTop = h.scrollHeight;

    setTimeout(function () {
      var pensando = turno.querySelector('.cl-pensando');

      // APAGADA: ni siquiera aparece en el catálogo, así que el error no es un permiso denegado
      // sino una herramienta que no existe. La llave lleva el módulo -- `resumen` existe en las
      // cinco instituciones y apagar la de una no puede apagar las otras cuatro.
      if (apagadas[llave(ESTA, q.tool)]) {
        // EL MENSAJE DE ERROR NO SE TRADUCE, y es a propósito: sale del Host en inglés, como los
        // warnings del catálogo. La guía lo dice en su regla del catálogo -- «diagnóstico para
        // quien empaqueta un módulo, no copy». Lo que sí se traduce es lo que Claude redacta.
        pensando.outerHTML =
          '<div class="cl-mcp mal"><div class="cl-mcp-cab">✕ <b>examenes_' + q.tool + '</b>' +
          '<span class="pin">' + t('clNoDisponible') + '</span></div>' +
          '<div class="cl-mcp-cuerpo">module \'examenes\' does not expose \'' + q.tool + '\'</div></div>' +
          '<div class="cl-dice">' + t('rApagada') + '</div>';
        h.scrollTop = h.scrollHeight;
        return;
      }

      var d = superficie(q.tool)();
      pensando.outerHTML =
        '<div class="cl-mcp"><div class="cl-mcp-cab">⚒ ' + t('clSeUso') + ' <b>examenes_' + q.tool + '</b>' +
        '<span class="pin">' + t('clLocal') + '</span></div>' +
        '<div class="cl-mcp-cuerpo">{}\n\n' + JSON.stringify(d, null, 1) + '</div></div>' +
        '<div class="cl-pensando">' + t('clEscribiendo') + '</div>';
      h.scrollTop = h.scrollHeight;

      setTimeout(function () {
        turno.querySelector('.cl-pensando').outerHTML = '<div class="cl-dice">' + redacta(cual, d) + '</div>';
        h.scrollTop = h.scrollHeight;

        if (paso === 8 && cual === 'resumen') {
          setTimeout(function () {
            var b = $('claude').querySelector('[data-q="tendencia"]');
            señalar(b, t('g8b'), t('g8a'), function () { responderClaude('tendencia'); }, 'izq');
          }, 700);
        }
        if (paso === 8 && cual === 'tendencia') setTimeout(function () { avanzar(9); }, 1500);
      }, 700);
    }, 620);
  }

  // LA FECHA VIAJA CON EL RENDER, no con el dato: regla 8 de las reglas de localización. El JSON
  // la trae ISO -- que es el dato -- y quien redacta la dice como se dice en su idioma. Por eso
  // sale de `toLocaleDateString` y no de una lista de meses escrita a mano, que sólo sabía
  // español.
  function fechaLegible(iso) {
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(IDIOMA === 'en' ? 'en-GB' : 'es-CR',
      { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // LO QUE CLAUDE ESCRIBE CON LO QUE LE DIERON, y nada más que con eso. Se traduce: es prosa del
  // asistente para la persona, no voz de la institución. Los VALORES no se tocan.
  function redacta(cual, d) {
    if (cual === 'resumen')
      return con('r1', { examenes: d.examenes, fuera: d.analitosFueraDeRango,
                         evento: d.ultimoEventoLeido });

    // LA PUERTA SE ABRIÓ Y AUN ASÍ NO ALCANZA, y ese es el remate verdadero. La lista trae filas de
    // EXAMEN -nombre, fecha, resultado-; no trae la serie del analito, ni su unidad en el tiempo,
    // ni el techo esperable, ni el «nivel de siempre». Un laboratorio entrega valores; la tendencia
    // no está en los valores, y esa lectura es [View]: la dibuja la pantalla y el modelo no la ve.
    // EL MÁS RECIENTE, buscado y no supuesto: el orden de la lista es cosa del módulo.
    // `ultimo.nombre` y `ultimo.resultado` NO se traducen: son dato del registro (regla 3), y se
    // ven en español dentro de la frase inglesa. Eso es lo que pasa de verdad.
    var ultimo = d.examenes.reduce(function (a, b) { return b.fecha > a.fecha ? b : a; });
    return con('r2', { nombre: ultimo.nombre, fecha: fechaLegible(ultimo.fecha),
                       resultado: ultimo.resultado });
  }

  // ---------------------------------------------------------------- alta

  function abrirAlta() {
    $('velo').hidden = false;
    var d = $('dlg');
    d.hidden = false;
    d.innerHTML =
      '<div class="dlg-cuerpo">' +
        '<h2>' + t('altaTitulo') + '</h2>' +
        '<p class="lead">' + t('altaLead') + '</p>' +
        '<div class="fila-alta"><input type="text" placeholder="' + t('altaPlaceholder') + '" disabled>' +
        '<button class="small" type="button">' + t('altaAgregar') + '</button></div>' +
        '<p class="o">' + t('altaO') + '</p>' +
        '<div style="text-align:center"><button class="small ghost" id="elegir" type="button">' +
        t('altaElegir') + '</button></div>' +
      '</div>';
  }

  function revisar() {
    $('dlg').innerHTML =
      '<div class="dlg-cuerpo">' +
        '<h2>' + t('altaTitulo') + '</h2>' +
        '<p class="lead">' + con('altaTrae', { archivo:
          '<code style="font-family:var(--mono);font-size:11.5px">' + inst().carpeta + '.gmod</code>' }) + '</p>' +
        '<div class="revision">' +
          '<div class="quien"><img class="marca" src="' + inst().logo + '" alt="">' +
            '<div><span class="title">' + inst().identidad + '</span>' +
            '<div class="lema">' + inst().lema + '</div></div></div>' +
          // LO QUE EL ALTA PUEDE MOSTRAR SIN INVENTAR, todo del manifiesto que viaja adentro.
          // El dominio es el único campo CONTRASTABLE de `publisher`: Gnothi ya sabe de qué host
          // bajó el bundle y lo compara -- por eso va, y por eso va antes que la versión.
          // TODO SALE DE `INSTITUCIONES`, ni un dato escrito dos veces. Estaba repetido acá y en
          // la tabla, y la primera vez que cambió uno -el .gmod pasó de 234 a 235 KB al rearmarlo-
          // el otro quedó mintiendo.
          '<dl>' +
            '<dt>' + t('altaQuien') + '</dt><dd><code>' + inst().dominio + '</code></dd>' +
            '<dt>' + t('altaVersion') + '</dt><dd>' + inst().version + '</dd>' +
            '<dt>' + t('altaCarpeta') + '</dt><dd><code>Documentos\\Gnothi\\' + inst().carpeta + '</code></dd>' +
            '<dt>' + t('altaRed') + '</dt><dd>' + t('altaNo') + '</dd>' +
            '<dt>' + t('altaConsultas') + '</dt><dd>' + inst().consultas.length + '</dd>' +
            '<dt>' + t('altaMotor') + '</dt><dd>' + t('altaPrestado') + '</dd>' +
            '<dt>' + t('altaRegistro') + '</dt><dd>' + inst().retencion + '</dd>' +
            '<dt>' + t('altaTamano') + '</dt><dd>' + inst().tamano + ' · ' + con('nArchivos', { n: inst().archivos }) + '</dd>' +
          '</dl>' +
        '</div>' +
      '</div>' +
      '<div class="dlg-pie"><button class="small ghost" type="button">' + t('altaCancelar') + '</button>' +
      '<button class="small" id="agregar" type="button">' + t('altaAgregar') + '</button></div>';
  }

  // ---------------------------------------------------------------- asistente


  // ---------------------------------------------------------------- installation.json




  function remate() {
    $('claude').hidden = false;
    pintarClaude();   // relee la lista: Claude ya no tiene esa herramienta
    var b = $('claude').querySelector('[data-q="tendencia"]');
    señalar(b, t('gRemate'), t('g8a'), function () {
        responderClaude('tendencia');
        setTimeout(cierreFinal, 1400);
      }, 'izq');
  }

  function cierreFinal() {
    contar(t('gCierre'), $('claude'), function () {
        $('claude').hidden = true;
        $('tarea-claude').classList.remove('abierta');
        vista = 'conexiones'; abierto = null; pintar();
        señalar($('abrir-mod'), t('gComprueba'), t('abrir'), function () {
          abierto = ESTA; pintar();
          señalar($('abrir-cara'), t('gMisma'), t('pantallaAbrir'), function () {
            vista = 'cara'; pintar();
            Array.prototype.forEach.call($('progreso').children, function (i) { i.className = 'hecho'; });
            setTimeout(function () {
              contar(t('gIntacto'), $('ventana'), function () {}, 'izq');
            }, 900);
          }, 'izq');
        }, 'izq');
      }, 'izq');
  }

  // ---------------------------------------------------------------- arranque

  for (var i = 0; i < TOTAL; i++) $('progreso').appendChild(document.createElement('i'));

  function desdeCero() {
    apagar();
    instaladas = ['compras', 'cargas', 'dealership', 'municipalidad'];
    apagadas = {}; vista = 'conexiones'; abierto = null; marco = null;
    $('ventana').hidden = true; $('ventana').innerHTML = '';
    $('dlg').hidden = true; $('velo').hidden = true;
    $('claude').hidden = true; $('claude').innerHTML = '';
    $('tarea-claude').classList.remove('abierta');
    $('tarea-mymi').classList.remove('abierta');
    avanzar(0);
  }

  $('reiniciar').addEventListener('click', desdeCero);

  // LO QUE ESTÁ FUERA DEL MONITOR también cambia de idioma: el título, el pie y los dos botones.
  function pintarPagina() {
    document.documentElement.lang = IDIOMA;
    document.title = t('pagTitulo');
    $('pag-titulo').textContent = t('pagTitulo');
    $('pag-sub').textContent = t('pagSub');
    $('idioma').textContent = t('idiomaBoton');
    $('reiniciar').textContent = t('reiniciar');
    $('nota-pie').innerHTML = t('pie');
  }

  // CAMBIAR DE IDIOMA REINICIA EL RECORRIDO, y es a propósito: los globos ya dichos quedarían en
  // el idioma viejo, y media conversación de Claude traducida a mitad de camino sería un aparato
  // que no existe. Se vuelve al paso 0, que además es donde se quiere estar para mostrarlo.
  $('idioma').addEventListener('click', function () {
    IDIOMA = IDIOMA === 'en' ? 'es' : 'en';
    pintarPagina();
    desdeCero();
  });

  pintarPagina();
  avanzar(0);
})();
</script>
