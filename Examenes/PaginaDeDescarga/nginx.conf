# URL1: sirve el WebAssembly publicado. Dos listeners a proposito, para cubrir el
# "con certificado y sin certificado" del diagrama.
#
# Nota de contexto seguro: http://localhost:8090 ES secure context para el browser,
# asi que la instalacion de la PWA y showDirectoryPicker funcionan ahi. El listener
# https con certificado self-signed ejercita la otra pata y va a mostrar advertencia
# de certificado - eso es justamente el punto de tener las dos.

worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El .wasm necesita su propio tipo o el browser no lo compila en streaming, y el
    # manifest tiene que salir como application/manifest+json o Chrome puede negarse a
    # ofrecer la instalacion (mime.types de nginx no conoce ninguno de los dos).
    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;
    }

    sendfile on;

    # Blazor publica cada asset tambien pre-comprimido (.br y .gz). gzip_static sirve
    # el .gz como si fuera el archivo original, con Content-Encoding: gzip - que es lo
    # que baja el payload de decenas de MB a unos pocos. El .br quedaria mejor todavia,
    # pero nginx:alpine no trae el modulo brotli, asi que esos archivos se ignoran.
    gzip_static on;

    server {
        listen 8090;
        listen 8453 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        root /usr/share/nginx/html;
        index index.html;

        # Sin esto el service worker no puede tomar scope de la raiz y la app no
        # queda instalable.
        location = /service-worker.js {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache";
        }

        location = /service-worker-assets.js {
            add_header Cache-Control "no-cache";
        }

        # La cara de la institucion: la pagina de descarga branded. AGREGADO de este
        # negocio sobre el nginx.conf del paquete, y va antes del try_files de abajo
        # porque si no la SPA se la traga.
        #
        # Vive en /descarga y no en la raiz porque mover la app de / no es gratis: le
        # cambia el <base href> al publish y le quita al service worker el scope de la
        # raiz, que es justo lo que la hace instalable. Si el equipo decide que la
        # pagina debe ser la raiz, eso se paga ahi.
        location = /descarga {
            alias /usr/share/nginx/descarga/index.html;
            default_type text/html;
        }

        # SPA: cualquier ruta desconocida cae en index.html para que el router de
        # Blazor la resuelva del lado del cliente.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
