# URL1: la pagina de descarga en la RAIZ, y la app publicada bajo /app/.
#
# Dos listeners a proposito, para cubrir el "con certificado y sin certificado" del
# diagrama.
#
# Nota de contexto seguro: http://localhost:8090 ES secure context para el browser, asi
# que la instalacion de la PWA y showDirectoryPicker funcionan ahi. El listener https
# ejercita la otra pata, y mientras no se instale la CA va a mostrar advertencia de
# certificado - eso es justamente el punto de tener las dos.
#
# DESDE UN TELEFONO SOLO SIRVE EL 8453, y no por gusto: localhost no llega a esta maquina,
# hay que entrar por la IP, y por http la pagina NO es contexto seguro. Sin contexto seguro
# no hay service worker, ni OPFS, ni picker de carpeta: la app abre y no puede guardar
# nada. Ver generar-certificado.sh, que explica por que ahi hacen falta DOS certificados.
#
# POR QUE LA APP NO ESTA EN LA RAIZ
#
# El service worker de una PWA toma scope del directorio desde donde se registra, y
# contesta TODA navegacion de ese scope con su index.html cacheado. Con la app en / eso
# incluia la pagina de descarga: nginx la servia perfecto -medido, "GET /descarga 200
# 18173"- y el browser igual mostraba el 404 del router de Blazor, porque la respuesta
# nunca llegaba a pedirse.
#
# Con la app en /app/, el scope del SW es /app/ y la raiz queda afuera. No hace falta
# ninguna lista de excepciones en el service worker: la separacion la hace la ruta.
#
# Esto exige que el publish sepa donde vive: <base href="/app/"> en index.html y
# const base = "/app/" en service-worker.published.js. Los tres tienen que decir lo mismo.

worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El .wasm necesita su propio tipo o el browser no lo compila en streaming, y el
    # manifest tiene que salir como application/manifest+json o Chrome puede negarse a
    # ofrecer la instalacion (mime.types de nginx no conoce ninguno de los dos).
    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;
    }

    sendfile on;

    # Blazor publica cada asset tambien pre-comprimido (.br y .gz). gzip_static sirve
    # el .gz como si fuera el archivo original, con Content-Encoding: gzip - que es lo
    # que baja el payload de decenas de MB a unos pocos. El .br quedaria mejor todavia,
    # pero nginx:alpine no trae el modulo brotli, asi que esos archivos se ignoran.
    gzip_static on;

    server {
        listen 8090;
        listen 8453 ssl;
        server_name localhost;

        # La CADENA, no la hoja sola: hoja + CA, en ese orden. Los emite
        # generar-certificado.sh, que ahora saca dos certificados y no uno -la CA para
        # instalar en el telefono, la hoja con la IP y el EKU serverAuth que iOS exige.
        ssl_certificate     /etc/nginx/certs/cadena.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # ------------------------------------------------ la pagina de descarga

        # La cara de la institucion. Es lo primero que ve la persona, y es un archivo
        # estatico: URL1 no es un csproj.
        location = / {
            root /usr/share/nginx/descarga;
            try_files /index.html =404;
        }

        # Los iconos de esa pagina, en locations propias.
        #
        # "location = /" es match EXACTO: cubre / y NADA mas. Cualquier otra ruta de la
        # raiz no tenia handler, asi que nginx contestaba 404 aunque el archivo existiera
        # en la montura. Sin esto, poner el png en descarga/ no alcanza.
        #
        # MEDIDO: la pestaña de la pagina de descarga quedaba sin icono, y era facil
        # atribuirselo al certificado self-signed porque el browser marca la conexion como
        # no segura. No era eso: /favicon.ico daba 404 igual por http://<ip>:8090, donde
        # no hay TLS de por medio. Era la ruta.
        location = /favicon.png {
            root /usr/share/nginx/descarga;
        }

        location = /apple-touch-icon.png {
            root /usr/share/nginx/descarga;
        }

        # ------------------------------------------------ la app

        location = /app { return 301 /app/; }

        # URL2, alcanzable desde el MISMO ORIGEN que sirve la app.
        #
        # No es que URL1 y URL2 se fusionen: siguen siendo dos nodos, dos procesos y dos
        # contenedores, y el token con su scope no cambia. Esto es solo por donde entra
        # el pedido, y resuelve tres cosas de una:
        #
        #   - un telefono no puede usar "localhost" para llegar a esta maquina;
        #   - una app servida por https NO puede llamar a un http — el browser lo
        #     bloquea por contenido mixto, y URL2 no tiene certificado propio;
        #   - desaparece el preflight de CORS, porque deja de ser cross-origin.
        #
        # MEDIDO: en un iPhone la app abria, no alcanzaba al proveedor y quedaba en cero
        # examenes. Apuntando al mismo origen, el mismo publish sirve en localhost, por
        # IP y por https sin recompilar.
        location /app/eventos/ {
            proxy_pass http://eventos-api:8091/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sin esto el service worker no puede tomar scope de /app/ y la app no queda
        # instalable. Van antes del bloque general porque una coincidencia exacta gana.
        location = /app/service-worker.js {
            alias /usr/share/nginx/app/service-worker.js;
            add_header Service-Worker-Allowed /app/;
            add_header Cache-Control "no-cache";
        }

        location = /app/service-worker-assets.js {
            alias /usr/share/nginx/app/service-worker-assets.js;
            add_header Cache-Control "no-cache";
        }

        # SPA: cualquier ruta interna desconocida cae en el index de la app para que el
        # router de Blazor la resuelva del lado del cliente. El fallback apunta a
        # /app/index.html y no a /index.html, que ahora es la pagina de descarga.
        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/ /app/index.html;
        }
    }
}
