# Los dos servers del diagrama, simulados. Mocks de happy path, nada mas.
#
#   URL1  wasm-host    la pagina de descarga en / y la app en /app/  (8090 http / 8453 https)
#   URL2  eventos-api  el endpoint que provee la narrativa    (8091)
#
# wasm-host sirve el publish de la caratula, asi que ANTES de levantarlo hay que
# generarlo:
#   dotnet publish ./App/Examenes.Wasm -c Release -o ./PaginaDeDescarga/publicado
# y los certificados del listener https:
#   ./PaginaDeDescarga/generar-certificado.sh

services:
  eventos-api:
    build:
      context: ./EndPointDeEventos
    container_name: examenes-eventos-api
    ports:
      - "8091:8091"
    restart: unless-stopped

  wasm-host:
    image: nginx:1.27-alpine
    container_name: examenes-wasm-host
    ports:
      - "8090:8090"
      - "8453:8453"
    volumes:
      - ./PaginaDeDescarga/nginx.conf:/etc/nginx/nginx.conf:ro
      # La pagina de descarga va en la RAIZ y la app bajo /app/. Dos monturas
      # hermanas, no anidadas: una montura dentro de otra :ro no se puede crear.
      - ./PaginaDeDescarga/descarga:/usr/share/nginx/descarga:ro
      - ./PaginaDeDescarga/publicado/wwwroot:/usr/share/nginx/app:ro
      - ./PaginaDeDescarga/certs:/etc/nginx/certs:ro
    depends_on:
      - eventos-api
    restart: unless-stopped
