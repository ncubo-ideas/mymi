<!DOCTYPE html>
<!-- SIN lang ESCRITO A MANO: el documento se sirve igual para los dos idiomas, asi que una
     etiqueta fija seria falsa para la mitad de quienes lo abren. La pone arranque-idioma.js
     antes de que haya Blazor, y la confirma Textos despues de negociar con el dispositivo. -->
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis exámenes · Laboratorio Clínico Delfos</title>
    <meta name="theme-color" content="#0e2f55" />
    <base href="/app/" />
    <!-- LO QUE SE VE ANTES DE QUE HAYA CATALOGO: el titulo y el canal de fallos. Se negocia
         aca, con la misma regla que Textos, porque estas dos superficies se pintan antes de
         que el catalogo llegue -y la del fallo, justamente cuando ya no va a llegar-. -->
    <script src="arranque-idioma.js"></script>
    <!-- CERO WEBFONTS: Georgia y Segoe UI son de sistema. Con un payload sin trimming
         de ~35 MB, no agregar descargas de fuentes es deliberado. -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <span class="frase">Ocurrió un error inesperado.</span>
        <a href="." class="reload">Recargar</a>
        <span class="dismiss" aria-label="Descartar este aviso">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
