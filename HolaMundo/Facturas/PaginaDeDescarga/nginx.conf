# URL1 para Súper El Triunfo. La pagina de descarga en la RAIZ, y la PWA publicada bajo /app/.
#
# POR QUE LA APP NO ESTA EN LA RAIZ: el service worker de una PWA toma scope del directorio
# desde donde se registra y contesta TODA navegacion de ese scope con su index.html cacheado.
# Con la app en /, la pagina de descarga queda inalcanzable en cuanto alguien instala la app.
# Con la app en /app/, la separacion la hace la ruta. (La leccion la pago Examenes.)
#
# http://localhost:8080 ES secure context para el browser, asi que instalar la PWA y
# showDirectoryPicker funcionan por http. El listener https es para servir por IP/telefono.
worker_processes 1;
events { worker_connections 256; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;
    }
    sendfile on;
    gzip_static on;
    server {
        listen 8080;
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # La pagina de descarga (la cara de la institucion).
        location = / {
            root /usr/share/nginx/descarga;
            try_files /index.html =404;
        }

        # Los descargables de "Para tu asistente": el modulo (.gmod) y Gnothi (.zip). Sin
        # esta location nginx solo serviria / y /app/, y los dos botones darian 404.
        location /descargas/ {
            root /usr/share/nginx/descarga;
        }

        location = /app { return 301 /app/; }

        # El proxy al proveedor (URL2). La app pide "eventos/" relativo a /app/, asi que cae
        # aca y se reenvia al mock. Asi el egreso sigue siendo del que sirve la app, no del
        # modulo.
        location /app/eventos/ {
            proxy_pass http://eventos-api:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /app/service-worker.js {
            alias /usr/share/nginx/app/service-worker.js;
            add_header Service-Worker-Allowed /app/;
            add_header Cache-Control "no-cache";
        }
        location = /app/service-worker-assets.js {
            alias /usr/share/nginx/app/service-worker-assets.js;
            add_header Cache-Control "no-cache";
        }

        # La PWA publicada.
        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/ /app/index.html;
        }
    }
}
