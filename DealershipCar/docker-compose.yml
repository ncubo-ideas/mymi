services:
  eventos-api:
    build:
      context: ./EndPointDeEventos
    container_name: dealership-car-eventos-api
    ports:
      - "8092:8092"
    restart: unless-stopped

  wasm-host:
    image: nginx:1.27-alpine
    container_name: dealership-car-wasm-host
    ports:
      - "8190:8190"
      - "8454:8454"
    volumes:
      - ./PaginaDeDescarga/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./PaginaDeDescarga/descarga:/usr/share/nginx/descarga:ro
      - ./PaginaDeDescarga/publicado/wwwroot:/usr/share/nginx/app:ro
      - ./PaginaDeDescarga/certs:/etc/nginx/certs:ro
    depends_on:
      - eventos-api
    restart: unless-stopped
