# URL1: la pagina de descarga en la RAIZ, y la app publicada bajo /app/.
#
# Dos listeners a proposito, para cubrir el "con certificado y sin certificado" del diagrama.
#
# Nota de contexto seguro: http://localhost:8190 ES secure context para el browser, asi que la
# instalacion de la PWA, showDirectoryPicker y OPFS funcionan ahi. El listener https con
# certificado self-signed ejercita la otra pata y va a mostrar advertencia de certificado -- eso
# es justamente el punto de tener las dos.
#
# POR QUE LA APP NO ESTA EN LA RAIZ, y por que este archivo se aparta de lo que dice el §T10 del
# plan. El plan pide "Service-Worker-Allowed: /". El service worker de una PWA toma scope del
# directorio desde donde se registra y contesta TODA navegacion de ese scope con su index.html
# cacheado: con la app en / eso incluiria la pagina de descarga, que nginx sirve perfecto y el
# browser igual reemplaza por el 404 del router de Blazor, porque la respuesta nunca llega a
# pedirse. Esta medido en la implementacion de referencia ("GET /descarga 200 18173" servido y
# 404 mostrado).
#
# Con la app en /app/ el scope del SW es /app/ y la raiz queda afuera. No hace falta ninguna
# lista de excepciones en el service worker: la separacion la hace la ruta. El header pasa a ser
# 'Service-Worker-Allowed: /app/', que es el mismo mecanismo con el scope correcto.
#
# Esto exige que el publish sepa donde vive: <base href="/app/"> en index.html y
# const base = "/app/" en service-worker.published.js. Los tres tienen que decir lo mismo.
#
# LOS PUERTOS SON DE ESTE NEGOCIO: 8190/8453+1 para el host y 8092 para los eventos. Existen por
# negocio para que los mocks de Examenes, Facturas y este corran a la vez.

worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El .wasm necesita su propio tipo o el browser no lo compila en streaming, y el manifest
    # tiene que salir como application/manifest+json o Chrome puede negarse a ofrecer la
    # instalacion.
    #
    # MEDIDO, y la mitad de este bloque ya no hace falta en esta imagen: el mime.types de
    # nginx 1.27 SI trae "application/wasm wasm" -- quitar esa linea deja el Content-Type
    # igual -- y NO trae webmanifest, que sin esta linea sale application/octet-stream. Se
    # deja el wasm igual, como defensa para un nginx mas viejo, y se deja dicho que hoy es
    # eso y no una necesidad. La implementacion de referencia dice que no conoce ninguno de
    # los dos, y esa mitad quedo desactualizada.
    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;
    }

    sendfile on;

    # Blazor publica cada asset tambien pre-comprimido (.br y .gz). gzip_static sirve el .gz como
    # si fuera el archivo original, con Content-Encoding: gzip -- que es lo que baja el payload de
    # decenas de MB a unos pocos. El .br quedaria mejor todavia, pero nginx:alpine no trae el
    # modulo brotli, asi que esos archivos se ignoran.
    gzip_static on;

    server {
        listen 8190;
        listen 8454 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # ------------------------------------------------ la pagina de descarga

        # La cara del concesionario. Es lo primero que ve la persona, y es un archivo estatico:
        # URL1 no es un csproj.
        location = / {
            root /usr/share/nginx/descarga;
            try_files /index.html =404;
        }

        # ------------------------------------------------ la app

        location = /app { return 301 /app/; }

        # URL2, alcanzable desde el MISMO ORIGEN que sirve la app.
        #
        # No es que URL1 y URL2 se fusionen: siguen siendo dos nodos, dos procesos y dos
        # contenedores, y el token con su scope no cambia. Esto es solo por donde entra el pedido,
        # y resuelve tres cosas de una:
        #
        #   - un telefono no puede usar "localhost" para llegar a esta maquina;
        #   - una app servida por https NO puede llamar a un http, el browser lo bloquea por
        #     contenido mixto, y URL2 no tiene certificado propio;
        #   - desaparece el preflight de CORS, porque deja de ser cross-origin.
        location /app/eventos/ {
            proxy_pass http://eventos-api:8092/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sin este header el service worker no puede tomar scope de /app/ y la app no queda
        # instalable. Van antes del bloque general porque una coincidencia exacta gana.
        location = /app/service-worker.js {
            alias /usr/share/nginx/app/service-worker.js;
            add_header Service-Worker-Allowed /app/;
            add_header Cache-Control "no-cache";
        }

        location = /app/service-worker-assets.js {
            alias /usr/share/nginx/app/service-worker-assets.js;
            add_header Cache-Control "no-cache";
        }

        # SPA: cualquier ruta interna desconocida cae en el index de la app para que el router de
        # Blazor la resuelva del lado del cliente. El fallback apunta a /app/index.html y no a
        # /index.html, que ahora es la pagina de descarga.
        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/ /app/index.html;
        }
    }
}
