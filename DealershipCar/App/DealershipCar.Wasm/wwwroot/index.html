<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My maintenance schedule · Sotavento Motors</title>
    <base href="/app/" />

    <!-- LA HOJA DE MUDBLAZOR VA PRIMERO Y LA DE LA APP DESPUES, para que la nuestra pueda
         ajustar lo suyo sin pelear por especificidad.

         NO SE ENLAZA LA FUENTE DE GOOGLE que la guia de MudBlazor sugiere: esta app es una PWA
         que tiene que abrir sin red -- el service worker cachea lo que se publica, y un
         fonts.googleapis.com no se publica -- asi que un enlace ahi seria una peticion que
         falla justo cuando la app mas promete funcionar. La tipografia sale del tema, del stack
         del sistema. -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DealershipCar.Wasm.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // El service worker es opcional para que la app funcione: si el registro falla -- por
        // ejemplo servida sin Service-Worker-Allowed, o desde un origen sin https -- la app tiene
        // que abrir igual. Sin el catch, un registro rechazado tira una promesa sin capturar y
        // ensucia la consola con un error que no es el problema de nadie.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(() => { });
        }
    </script>
</body>

</html>
