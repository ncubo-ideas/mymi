# URL1: la pagina de descarga en la RAIZ, y la app publicada bajo /app/.
#
# Dos listeners a proposito, para cubrir el "con certificado y sin certificado" del
# diagrama. http://localhost:8100 ES secure context para el browser, asi que la
# instalacion de la PWA y showDirectoryPicker funcionan ahi.
#
# POR QUE LA APP NO ESTA EN LA RAIZ (medido por Examenes): el service worker de una PWA
# toma scope del directorio desde donde se registra y contesta TODA navegacion de ese
# scope con su index.html cacheado. Con la app en /, la pagina de descarga queda
# inalcanzable en cuanto alguien instala la app. Con la app en /app/, la separacion la
# hace la ruta. Tres archivos tienen que decir lo mismo: el <base href> de index.html,
# el const base de service-worker.published.js y este archivo.

worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El .wasm necesita su propio tipo o el browser no lo compila en streaming, y el
    # manifest tiene que salir como application/manifest+json o Chrome puede negarse a
    # ofrecer la instalacion (mime.types de nginx no conoce ninguno de los dos).
    types {
        application/wasm          wasm;
        application/manifest+json webmanifest;
    }

    sendfile on;

    # Blazor publica cada asset tambien pre-comprimido (.br y .gz). gzip_static sirve
    # el .gz con Content-Encoding: gzip. El .br quedaria mejor, pero nginx:alpine no
    # trae el modulo brotli.
    gzip_static on;

    server {
        listen 8100;
        listen 8463 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # ------------------------------------------------ la pagina de descarga

        # La cara de la institucion. Es lo primero que ve la persona, y es un archivo
        # estatico: URL1 no es un csproj.
        location = / {
            root /usr/share/nginx/descarga;
            try_files /index.html =404;
        }

        # ------------------------------------------------ la app

        location = /app { return 301 /app/; }

        # URL2, alcanzable desde el MISMO ORIGEN que sirve la app.
        #
        # No es que URL1 y URL2 se fusionen: siguen siendo dos nodos, dos procesos y dos
        # contenedores, y el token con su scope no cambia. Esto es solo por donde entra
        # el pedido, y resuelve tres cosas de una (medido por Renan en Examenes, con un
        # iPhone): un telefono no puede usar "localhost" para llegar a esta maquina; una
        # app servida por https NO puede llamar a un http (contenido mixto, y URL2 no
        # tiene certificado propio); y desaparece el preflight de CORS.
        location /app/eventos/ {
            proxy_pass http://eventos-api:8101/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sin esto el service worker no puede tomar scope de /app/ y la app no queda
        # instalable. Van antes del bloque general porque una coincidencia exacta gana.
        location = /app/service-worker.js {
            alias /usr/share/nginx/app/service-worker.js;
            add_header Service-Worker-Allowed /app/;
            add_header Cache-Control "no-cache";
        }

        location = /app/service-worker-assets.js {
            alias /usr/share/nginx/app/service-worker-assets.js;
            add_header Cache-Control "no-cache";
        }

        # SPA: cualquier ruta interna desconocida cae en el index de la app para que el
        # router de Blazor la resuelva del lado del cliente.
        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/ /app/index.html;
        }
    }
}
