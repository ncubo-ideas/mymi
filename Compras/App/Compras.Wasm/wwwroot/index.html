<!DOCTYPE html>
<!-- Bootstrap queda en su tema CLARO, con sus variables remapeadas a la paleta de La Guaria
     en css/app.css. Un supermercado es verde y blanco: el verde entra como masa en la barra
     superior y como acento en lo demas, no como fondo. El primer intento puso toda la app
     sobre un gradiente verde oscuro y se leia clinico, que es el tono de Delfos. -->
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Guaria y vos · Supermercado La Guaria</title>
    <base href="/app/" />
    <!-- PLUS JAKARTA SANS, la tipografia del diseño de Fernanda.

         ⚠️ VIENE DE GOOGLE, y eso es un pendiente y no una solucion: esta app promete
         funcionar "sin nosotros, y sin conexion", asi que una fuente que se baja de
         internet se cae el dia que alguien la abra sin red. Hay que servir el woff2 desde
         wwwroot. Mientras tanto, la pila de css/app.css cae en Segoe UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Compras.Wasm.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- iOS NO respeta la transparencia -compone sobre negro- y aplica su propio redondeo,
         asi que apple-touch-icon va PLENO y sin redondear. Apuntarlo al icono redondeado
         dejaba las esquinas negras. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
